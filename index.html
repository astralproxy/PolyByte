<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PolyByte</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="stage">
    <div id="feed"></div>
    <div id="gest" aria-label="Game surface: tap, hold, drag. Flick up or down to switch games."></div>
    <div id="bar"><i></i></div>
    <div id="sc"></div>
    <button id="hm" title="Menu: Back to Feed" aria-label="Menu: Back to Feed">☰</button>
    
    <div id="rail">
      <button id="lk" title="Like" aria-label="Like">♥</button>
      <button id="dl" title="Not for me" aria-label="Not for me">✕</button>
    </div>

    <div id="cap"></div>
    <div id="end" hidden>
      <h2 id="etx"></h2>
      <p id="esub"></p><button id="rp">Replay</button><button id="nx">Next game</button>
    </div>
    <div id="toast"></div>

    <section id="home" aria-label="Game Feed" hidden>
      <nav id="side" aria-label="Panels">
        <button id="feedBtn" title="Game Feed" aria-label="Game Feed"><b>⌂</b><span>Feed</span></button>
        <button id="pf" title="Taste Profile" aria-label="Taste Profile"><b>◔</b><span>Taste</span></button>
        <button id="sp" title="Creator API" aria-label="Creator API"><b>{ }</b><span>API</span></button>
      </nav>
      <div id="main">
        <header>
          <h1>PolyByte</h1>
          <p id="sub">Loading the library…</p>
          <button id="pl" disabled>▶ Play Random</button>
        </header>
        <div id="list" role="list"><p class="note">Loading…</p></div>
        <div id="panel" hidden></div>
      </div>
    </section>
  </div>

  <script>
    /* =====================================================================
       MICROFEED HOST SHELL
       Guests run in <iframe sandbox="allow-scripts"> (opaque origin: no cookies,
       storage, network to host, or DOM access). All traffic is postMessage with
       {sdk:1,type,...}. Host drives the frame clock and sends TICKs.
       ===================================================================== */
    const $ = s => document.querySelector(s), cl = (x, a, b) => Math.min(b, Math.max(a, x)), pick = a => a[(Math.random() * a.length) | 0];
    const num = (x, d = 0) => Number.isFinite(+x) ? +x : d, esc = s => s.replace(/[&<>]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'}[c]));

    /* ---- Platform constants ---- */
    const SESSION_MS = 15000, MIN_MS = 10000, MAX_MS = 30000; // default / allowed session length
    const LOAD_MS = 3000, HANG_MS = 2000, RESULT_MS = 600;    // init, heartbeat, endGame response deadlines

    /* ---- Taste profile: 20 independent interest scores, 0–100, non-zero-sum ---- */
    const DIMS = ['Reflex', 'Precision', 'Rhythm', 'Memory', 'Puzzle', 'Strategy', 'Racing', 'Arcade', 'Retro', 'Neon', 'Cosmic', 'Nature', 'Food', 'Animals', 'Horror', 'Cozy', 'Sports', 'Music', 'Humor', 'Minimal'];
    const IDX = Object.fromEntries(DIMS.map((d, i) => [d, i]));
    const TASTE_SCORE_MIN = 0, TASTE_SCORE_MAX = 100, TASTE_INITIAL_SCORE = 50, TASTE_LEARNING_RATE = 14;
    const TASTE_COMPLETION_WEIGHT = .5, TASTE_DWELL_WEIGHT = .3, TASTE_REPLAY_WEIGHT = .2, TASTE_REPLAY_CAP = 3, TASTE_FULL_DWELL = 1;
    const TASTE_EARLY_EXIT_MS = 2000, TASTE_EARLY_EXIT_SIGNAL = -.6, TASTE_NEUTRAL_IMPACT = .4, TASTE_SIGNAL_SCALE = 2;
    const TASTE_LIKE_BONUS = .5, TASTE_DISLIKE_PENALTY = .8, TASTE_SIGNAL_MIN = -1, TASTE_SIGNAL_MAX = 1;
    const TASTE_STORAGE_KEY = 'polybyte.taste-profile.v1';
    class TasteProfile {
      constructor() {this.v = new Float32Array(DIMS.length).fill(TASTE_INITIAL_SCORE)}
      // Each tagged interest moves by learning rate × tag weight × feedback signal, clamped to the score range.
      update(tags, signal) {for (let i = 0; i < DIMS.length; i++)if (tags[i] > 0) this.v[i] = cl(this.v[i] + TASTE_LEARNING_RATE * tags[i] * signal, TASTE_SCORE_MIN, TASTE_SCORE_MAX)}
      // A game's affinity is the tag-weighted average of the matching interest scores.
      affinity(tags) {let a = 0, w = 0; for (let i = 0; i < DIMS.length; i++) {a += tags[i] * this.v[i]; w += tags[i]} return w ? a / w : TASTE_INITIAL_SCORE}
    }
    const profile = new TasteProfile(), metrics = new Map(), log = [];
    let tasteStorageAvailable = true;
    function loadTasteProfile() {
      try {
        const saved = localStorage.getItem(TASTE_STORAGE_KEY);
        if (saved === null) return;
        let values;
        try {values = JSON.parse(saved)}
        catch (e) {console.warn('Ignoring malformed saved Taste profile.', e); return}
        if (!Array.isArray(values) || values.length !== DIMS.length ||
            values.some(v => typeof v !== 'number' || !Number.isFinite(v) || v < TASTE_SCORE_MIN || v > TASTE_SCORE_MAX)) {
          console.warn('Ignoring invalid saved Taste profile: expected one score from 0 to 100 per interest.');
          return;
        }
        profile.v.set(values);
      }
      catch (e) {
        tasteStorageAvailable = false;
        console.warn('Unable to access the saved Taste profile.', e);
        toast('Taste profile could not be loaded locally.');
      }
    }
    function saveTasteProfile() {
      if (!tasteStorageAvailable) return;
      try {localStorage.setItem(TASTE_STORAGE_KEY, JSON.stringify(Array.from(profile.v)))}
      catch (e) {
        tasteStorageAvailable = false;
        console.warn('Unable to save the Taste profile locally.', e);
        toast('Taste profile could not be saved locally.');
      }
    }
    const M = id => {if (!metrics.has(id)) metrics.set(id, {plays: 0, replays: 0, bestCompletion: 0, dwellMs: 0, errors: 0}); return metrics.get(id)};
    const L = m => {log.unshift(((performance.now() / 1000) | 0) + 's ' + m); if (log.length > 40) log.pop(); if (panel === 'prof') renderPanel()};

    /* ---- Catalog + router (infinite: variants are generated on demand) ---- */
    const THEMES = [
      {n: 'Cosmic', h: 250, t: {Cosmic: 1, Neon: .5, Arcade: .4}}, {n: 'Candy', h: 320, t: {Food: 1, Cozy: .6, Humor: .4}},
      {n: 'Forest', h: 130, t: {Nature: 1, Animals: .5, Cozy: .5}}, {n: 'Retro', h: 40, t: {Retro: 1, Arcade: .8, Music: .2}},
      {n: 'Neon', h: 180, t: {Neon: 1, Rhythm: .5, Racing: .4}}, {n: 'Spooky', h: 285, t: {Horror: 1, Humor: .3, Memory: .2}},
      {n: 'Sports', h: 10, t: {Sports: 1, Racing: .5, Precision: .4}}, {n: 'Zen', h: 200, t: {Minimal: 1, Cozy: .6, Puzzle: .3}}];
    let seq = 0, recent = [];
    function variant(b) {
      const base = b || pick(Object.keys(BASES)), th = pick(THEMES), tags = new Float32Array(20);
      for (const [k, w] of Object.entries(BASES[base].t)) tags[IDX[k]] = w;
      for (const [k, w] of Object.entries(th.t)) tags[IDX[k]] = Math.max(tags[IDX[k]], w);
      return {id: 'g' + (++seq), base, theme: th, seed: (Math.random() * 1e9) | 0, tags, title: BASES[base].title + ' · ' + th.n};
    }
    function route() { // best of 8 fresh candidates by taste affinity; 20% pure exploration; repeat penalty
      const c = Array.from({length: 8}, variant);
      if (Math.random() < .2) return c[0];
      let best = c[0], bs = -1e9;
      for (const v of c) {const k = v.base + v.theme.n, sc = profile.affinity(v.tags) + Math.random() * 10 - (recent.includes(k) ? 25 : 0); if (sc > bs) {bs = sc; best = v} }
      recent.push(best.base + best.theme.n); if (recent.length > 4) recent.shift();
      return best;
    }

    /* ---- SDK shim injected into every guest (implements the window bridge) ---- */
    const SHIM = `(function(){var P=parent,cv=document.getElementById('c'),ctx=cv.getContext('2d'),run=0;
function send(t,d){d=d||{};d.sdk=1;d.type=t;P.postMessage(d,'*')}
function fail(m){send('ERROR',{msg:String(m)})}
addEventListener('error',function(e){fail(e.message)});
addEventListener('unhandledrejection',function(e){fail(e.reason)});
window.Platform={endGame:function(){send('END_REQUEST')}};
window.endGame=window.Platform.endGame;
function res(){try{return getResult()}catch(e){fail(e);return null}}
window.__boot=function(){
 for(var f of ['updateGame','handleInput','renderAll','getResult'])if(typeof window[f]!=='function')return fail('Missing required function: '+f);
 var m=window.GameMeta||{};send('READY',{meta:{title:m.title,gameLength:m.gameLength}})};
addEventListener('message',function(e){if(e.source!==P)return;var m=e.data||{};
 try{
  if(m.type==='START'){if(window.initGame)initGame(window.PARAMS);run=1;renderAll(ctx);send('HB',{r:res()})}
  else if(m.type==='TICK'&&run){updateGame(m.dt);renderAll(ctx);send('HB',{r:res()})}
  else if(m.type==='INPUT'&&run)handleInput(m.event);
  else if(m.type==='END_GAME'){run=0;if(window.onEndGame)onEndGame();send('RESULT',{r:res()})}
 }catch(err){fail(err)}});
})();`;

    /* ---- Creator contract (shown to creators in the { } panel) ---- */
    const SPEC = `CREATOR API v1 – micro-game contract

Constraints
  gameLength: design for 10–30 s of active play. Declare it with
  window.GameMeta={title:'…',gameLength:15000} (ms). Host default 15 s, clamped 10–30 s.
  One self-contained HTML file in a sandbox="allow-scripts" iframe. The host
  injects window.PARAMS and a 360×640 <canvas>; no network, storage or parent access.

Required globals
  getResult()            -> { score:number, timeElapsed:number,
                              completionPercent:number(0-100), customData:object }
  updateGame(deltaTime)  // seconds; called by the host frame loop
  handleInput(event)     // host-normalised actions:
      { type:'ACTION_PRIMARY',     x, y }          tap / Space        (x,y = 0..1)
      { type:'ACTION_SECONDARY',   x, y }          long-press / Shift (x,y = 0..1)
      { type:'DIRECTIONAL_VECTOR', x, y, active }  drag / arrow keys  (x,y = -1..1)
  renderAll(canvasContext) // draw one frame on the supplied 2D context

Platform callback
  endGame()  (alias Platform.endGame()): force the end-game condition now. The host
             then calls getResult() and shows the result card. The host also uses the
             same path when the session timer expires (optional hook: onEndGame()).

Fail-safes (guest is terminated and the feed auto-advances)
  no ready signal within 3 s, a missing required function, an uncaught error,
  no heartbeat for 2 s (frozen loop), or no result within 0.6 s of endGame.

Wire format (handled by the injected shim; creators never touch it)
  host->guest  START | TICK{dt} | INPUT{event} | END_GAME
  guest->host  READY{meta} | HB{r} | RESULT{r} | ERROR{msg} | END_REQUEST`;

    /* ---- Embedded compliant micro-games (creator template = Pop Rush) ---- */
    /* ---- Library loader: Library/manifest.json lists games; each game is its own HTML file ---- */
    const LIB = 'Library/'; let BASES = {}, GAMES = {}, LIST = [];
    async function loadLibrary() {
      const man = await (await fetch(LIB + 'manifest.json')).json();
      await Promise.all(man.games.map(async gm => {
        try {
          const r = await fetch(LIB + gm.file); if (!r.ok) throw new Error(r.status);
          GAMES[gm.id] = await r.text();
          BASES[gm.id] = {title: gm.title, icon: gm.icon, desc: gm.description, t: Object.fromEntries(Object.entries(gm.tags || {}).filter(([k]) => k in IDX))}
        }
        catch (e) {console.warn('Skipped library game', gm.id, e)}
      }));
      LIST = man.games.filter(gm => BASES[gm.id]); // keep manifest order for the Feed
      if (!Object.keys(BASES).length) throw new Error('Library is empty');
    }

    function srcdoc(v) {
      const p = JSON.stringify({hue: v.theme.h, seed: v.seed, theme: v.theme.n}).replace(/</g, '\\u003c');
      return '<!doctype html><meta charset=utf-8><style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{width:100%;height:100%;display:block}</style><canvas id=c width=360 height=640></canvas><script>window.PARAMS=' + p + ';' + SHIM + '<\/script>' + GAMES[v.base] + '<script>window.__boot()<\/script>';
    }

    /* ---- Feed: slots for idx-1 / idx / idx+1, all preloaded; only idx is ticked ---- */
    const feed = $('#feed'); let idx = 0, queue = [], slots = new Map(), busy = false, panel = '', view = 'home'; // view: 'home' (Feed page) | 'play'
    const send = (s, type, d) => {if (s.fr && s.fr.contentWindow) s.fr.contentWindow.postMessage({sdk: 1, type, ...d}, '*')};

    function ensure(k) {if (k < 0) return; while (queue.length <= k) queue.push(route()); if (!slots.has(k)) slots.set(k, mkSlot(k))}
    function mkSlot(k) {
      const el = document.createElement('div'); el.className = 'slot'; el.style.transform = 'translateY(' + (k - idx) * 100 + '%)'; feed.append(el);
      const s = {i: k, v: queue[k], el, dur: SESSION_MS, state: 'loading'}; build(s); return s;
    }
    function build(s) { // (re)create the sandboxed iframe; state machine: loading→ready→playing→ending→ended→left | dead
      if (s.fr) s.fr.remove(); clearTimeout(s.lt); clearTimeout(s.et); clearTimeout(s.at);
      Object.assign(s, {state: 'loading', r: null, res: null, fl: 0});
      const f = document.createElement('iframe');
      f.setAttribute('sandbox', 'allow-scripts'); f.title = s.v.title; f.srcdoc = srcdoc(s.v);
      s.fr = f; s.el.prepend(f);
      s.lt = setTimeout(() => {if (s.state === 'loading') kill(s, 'failed to initialise')}, LOAD_MS);
    }
    function layout() {
      for (const k of [idx - 1, idx, idx + 1]) ensure(k);
      for (const [k, s] of slots) {
        if (Math.abs(k - idx) > 1) {s.fr && s.fr.remove(); clearTimeout(s.lt); s.el.remove(); slots.delete(k)}
        else {s.el.style.transform = 'translateY(' + (k - idx) * 100 + '%)'; if (s.state === 'left' && k !== idx) build(s)} // keep neighbours warm
      }
    }
    function activate(s) {
      showEnd(0); hudReset(s);
      if (s.state === 'ready') start(s);
      else if (s.state === 'dead') {s.v = queue[s.i] = route(); build(s); hudReset(s)}
      else if (s.state === 'left') build(s);
      // 'loading': READY handler starts it because s.i===idx
    }
    function go(n) {
      if (busy || view !== 'play') return; const ni = idx + n;
      if (ni < 0) {toast('This is the first game'); return }
      busy = true; leave(slots.get(idx)); idx = ni; layout(); activate(slots.get(idx));
      setTimeout(() => busy = false, 420);
    }

    /* ---- Session lifecycle ---- */
    function start(s) {
      s.state = 'playing'; s.t0 = s.hb = performance.now(); s.fl = 0; M(s.v.id).plays++;
      send(s, 'START'); L('start ' + s.v.title); showEnd(0);
    }
    function finish(s, why) { // force/trigger end: ask guest for final result, but never wait long
      if (s.state !== 'playing') return;
      s.state = 'ending'; s.why = why; send(s, 'END_GAME');
      s.et = setTimeout(() => kill(s, 'no result after endGame'), RESULT_MS);
    }
    function onEnded(s) {
      s.elapsed = performance.now() - s.t0;
      const r = s.res || {score: 0, completionPercent: 0}; M(s.v.id).bestCompletion = Math.max(M(s.v.id).bestCompletion, r.completionPercent);
      L('end ' + s.v.title + ' ' + Math.round(r.completionPercent) + '% (' + s.why + ')');
      if (s.i === idx) {
        $('#etx').textContent = s.why === 'timeout' ? 'Time’s up' : r.completionPercent >= 100 ? 'Cleared!' : 'Game over';
        $('#esub').textContent = 'Score ' + Math.round(r.score) + ' · ' + Math.round(r.completionPercent) + '% complete';
        showEnd(1);
      }
    }
    function replay() {
      const s = slots.get(idx); if (!s || s.state !== 'ended') return;
      clearTimeout(s.at); s.dwell = (s.dwell || 0) + s.elapsed; s.best = Math.max(s.best || 0, s.res ? s.res.completionPercent : 0); s.rep = (s.rep || 0) + 1;
      M(s.v.id).replays++; L('replay ' + s.v.title); showEnd(0); build(s);
    }
    function kill(s, why) { // watchdog: terminate the guest outright and skip it
      if (s.state === 'dead') return;
      clearTimeout(s.lt); clearTimeout(s.et); clearTimeout(s.at);
      if (s.fr) {s.fr.remove(); s.fr = null}
      s.state = 'dead'; M(s.v.id).errors++; L('killed ' + s.v.title + ': ' + why);
      if (s.i === idx) {showEnd(0); toast('Game stopped (' + why + '). Skipping…'); setTimeout(() => {if (slots.get(idx) === s) go(1)}, 650)}
    }

    /* ---- Implicit + explicit signals → taste profile when a game ends or is skipped ---- */
    function leave(s, includeEngagement = true) {
      if (!s || !(s.dwell > 0 || ['playing', 'ending', 'ended'].includes(s.state))) return;
      clearTimeout(s.at); clearTimeout(s.et);
      const el = s.state === 'ended' ? s.elapsed : s.state === 'loading' ? 0 : performance.now() - s.t0, dwell = (s.dwell || 0) + el;
      const cur = s.res || s.r, comp = Math.max(s.best || 0, cur ? cur.completionPercent : 0) / 100, mt = M(s.v.id);
      mt.dwellMs += dwell; mt.bestCompletion = Math.max(mt.bestCompletion, comp * 100);

      const explicitSignal = (s.liked || 0) * (s.liked > 0 ? TASTE_LIKE_BONUS : TASTE_DISLIKE_PENALTY);
      let signal = 0;
      if (includeEngagement) {
        // An immediate unliked exit gets a strong negative signal.
        const early = dwell < TASTE_EARLY_EXIT_MS && !s.liked;
        // Otherwise, engagement blends completion, capped dwell fraction, and capped replay count.
        const impact = early ? 0 : TASTE_COMPLETION_WEIGHT * comp + TASTE_DWELL_WEIGHT * Math.min(TASTE_FULL_DWELL, dwell / s.dur) +
          TASTE_REPLAY_WEIGHT * Math.min(TASTE_REPLAY_CAP, s.rep || 0) / TASTE_REPLAY_CAP;
        // Center engagement at neutral impact, scale it, then add explicit like/dislike feedback.
        signal = early ? TASTE_EARLY_EXIT_SIGNAL : (impact - TASTE_NEUTRAL_IMPACT) * TASTE_SIGNAL_SCALE;
      }
      signal = cl(signal + explicitSignal, TASTE_SIGNAL_MIN, TASTE_SIGNAL_MAX);
      if (includeEngagement || explicitSignal) {profile.update(s.v.tags, signal); saveTasteProfile()}
      L('leave ' + s.v.title + ' dwell ' + (dwell / 1000).toFixed(1) + 's comp ' + Math.round(comp * 100) + '%' +
        (includeEngagement || explicitSignal ? ' signal ' + signal.toFixed(2) : ' (taste unchanged)'));
      Object.assign(s, {state: 'left', dwell: 0, rep: 0, best: 0, liked: 0});
    }

    /* ---- Message listener: only accepts messages from a known iframe window ---- */
    function sane(r) {return r && typeof r === 'object' ? {score: num(r.score), timeElapsed: num(r.timeElapsed), completionPercent: cl(num(r.completionPercent), 0, 100), customData: r.customData && typeof r.customData === 'object' ? r.customData : {}} : null}
    addEventListener('message', e => {
      const m = e.data; if (!m || m.sdk !== 1) return;
      const s = [...slots.values()].find(x => x.fr && x.fr.contentWindow === e.source); if (!s) return;
      switch (m.type) {
        case 'READY': if (s.state !== 'loading') break; clearTimeout(s.lt); s.state = 'ready';
          s.dur = cl(num(m.meta && m.meta.gameLength, SESSION_MS), MIN_MS, MAX_MS); if (s.i === idx) start(s); break;
        case 'HB': s.hb = performance.now(); s.fl = Math.max(0, s.fl - 1); s.r = sane(m.r) || s.r; break;
        case 'END_REQUEST': finish(s, 'endGame'); break;
        case 'RESULT': if (s.state !== 'ending') break; clearTimeout(s.et); s.res = sane(m.r) || {score: 0, timeElapsed: 0, completionPercent: 0, customData: {}}; s.state = 'ended'; onEnded(s); break;
        case 'ERROR': kill(s, 'error: ' + String(m.msg).slice(0, 60)); break;
      }
    });

    /* ---- Host frame clock: ticks the active guest, enforces session timer + freeze watchdog ---- */
    let last = performance.now(), dir = {x: 0, y: 0, active: false}, sentDir = '';
    function loop(now) {
      const gap = now - last, dt = Math.min(.05, gap / 1000); last = now;
      const s = slots.get(idx);
      if (s && s.state === 'playing') {
        if (gap > 500) {s.t0 += gap; s.hb = now}                      // tab was hidden / host stalled: pause the clocks
        const el = now - s.t0;
        if (now - s.hb > HANG_MS) kill(s, 'frozen');
        else if (el >= s.dur) finish(s, 'timeout');
        else {
          if (s.fl < 3) {s.fl++; send(s, 'TICK', {dt})}              // back-pressure: never flood a slow guest
          const k = JSON.stringify(dir); if (k !== sentDir) {sentDir = k; send(s, 'INPUT', {event: {type: 'DIRECTIONAL_VECTOR', ...dir}})}
        }
        hud(s, el);
      }
      requestAnimationFrame(loop);
    }
    function inp(type, extra) {const s = slots.get(idx); if (s && s.state === 'playing') send(s, 'INPUT', {event: {type, ...extra}})}

    /* ---- Gesture + keyboard normalisation (host overlay owns all pointer input) ---- */
    const g = $('#gest'); let d = null;
    g.onpointerdown = e => {
      g.setPointerCapture(e.pointerId); d = {x: e.clientX, y: e.clientY, t: performance.now(), mv: 0, lp: 0};
      d.tm = setTimeout(() => {if (d && !d.mv) {d.lp = 1; const r = g.getBoundingClientRect(); inp('ACTION_SECONDARY', {x: (d.x - r.left) / r.width, y: (d.y - r.top) / r.height})} }, 450)
    };
    g.onpointermove = e => {
      if (!d) return; const dx = e.clientX - d.x, dy = e.clientY - d.y; if (Math.hypot(dx, dy) > 12) d.mv = 1;
      dir = d.mv ? {x: cl(dx / 60, -1, 1), y: cl(dy / 60, -1, 1), active: true} : dir
    };
    g.onpointerup = e => {
      if (!d) return; clearTimeout(d.tm); const dx = e.clientX - d.x, dy = e.clientY - d.y, t = performance.now() - d.t;
      dir = {x: 0, y: 0, active: false};
      if (Math.abs(dy) > 90 && Math.abs(dy) > 1.5 * Math.abs(dx)) go(dy < 0 ? 1 : -1);                 // vertical flick = switch game
      else if (!d.mv && !d.lp && t < 450) {const r = g.getBoundingClientRect(); inp('ACTION_PRIMARY', {x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height})}
      d = null
    };
    g.onpointercancel = () => {if (d) clearTimeout(d.tm); d = null; dir = {x: 0, y: 0, active: false}};
    const K = {};
    function kd() {const x = (K.ArrowRight ? 1 : 0) - (K.ArrowLeft ? 1 : 0), y = (K.ArrowDown ? 1 : 0) - (K.ArrowUp ? 1 : 0); if (x || y) dir = {x, y, active: true}; else if (!d) dir = {x: 0, y: 0, active: false}}
    addEventListener('keydown', e => {
      if (view !== 'play') return;
      K[e.key] = 1;
      if (e.key === ' ') {e.preventDefault(); if (!e.repeat) inp('ACTION_PRIMARY', {x: .5, y: .5})}
      else if (e.key === 'Shift' || e.key === 'x') inp('ACTION_SECONDARY', {x: .5, y: .5});
      else if (e.key === 'j' || e.key === 'PageDown') go(1); else if (e.key === 'k' || e.key === 'PageUp') go(-1); kd()
    });
    addEventListener('keyup', e => {delete K[e.key]; kd()});
    addEventListener('wheel', e => {if (Math.abs(e.deltaY) > 40) go(e.deltaY > 0 ? 1 : -1)}, {passive: true});

    /* ---- HUD / panels ---- */
    let tt; const toast = m => {const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 1800)};
    const showEnd = on => {$('#end').hidden = !on};
    function hud(s, el) {$('#bar i').style.width = Math.min(100, el / s.dur * 100) + '%'; $('#sc').textContent = s.r ? '★ ' + Math.round(s.r.score) + ' · ' + Math.round(s.r.completionPercent) + '%' : ''}
    function hudReset(s) {
      $('#bar i').style.width = '0'; $('#sc').textContent = '';
      const top = [...s.v.tags].map((w, i) => [w, i]).filter(x => x[0] > 0).sort((a, b) => b[0] - a[0]).map(x => DIMS[x[1]]).join(', ');
      $('#cap').innerHTML = '<b>' + esc(s.v.title) + '</b><span>' + esc(top) + '</span>';
      $('#lk').classList.toggle('on', s.liked === 1);
    }

    function openPanel(k) {
      panel = panel === k ? '' : k;
      $('#home header').hidden = !!panel; $('#list').hidden = !!panel; $('#panel').hidden = !panel;
      $('#feedBtn').classList.toggle('on', !panel);
      $('#pf').classList.toggle('on', panel === 'prof'); $('#sp').classList.toggle('on', panel === 'spec');
      renderPanel();
    }

    function closePanel() {
      panel = ''; $('#home header').hidden = false; $('#list').hidden = false; $('#panel').hidden = true;
      $('#feedBtn').classList.add('on');
      $('#pf').classList.remove('on'); $('#sp').classList.remove('on');
    }

    function renderPanel() {
      if (!panel) return; const content = $('#panel');
      if (panel === 'spec') {content.className = 'api-panel'; content.innerHTML = '<h3>API</h3><pre>' + esc(SPEC) + '</pre><h3>Compliant template</h3><pre>' + esc(GAMES[Object.keys(GAMES)[0]] || '') + '</pre>'; return }
      const top = [...profile.v].map((v, i) => [v, i]).sort((a, b) => b[0] - a[0]).slice(0, 3).map(x => x[1]);
      content.className = 'profile-panel';
      content.innerHTML = '<div class="taste-scores"><h3>Taste Profile<br>20 interests (each 0–100)</h3><br><hr>' +
        DIMS.map((n, i) => '<div class=r><b>' + n + '</b><u><i class="' + (top.includes(i) && profile.v[i] !== 50 ? 't' : '') + '" style="width:' + profile.v[i] + '%"></i></u><span>' + Math.round(profile.v[i]) + '</span></div>').join('') +
        '<hr></div><section class="event-log-panel" aria-label="Event log"><h3>Event log</h3><pre>' + esc(log.join('\n') || 'Nothing yet.') + '</pre></section>';
    }
    $('#lk').onclick = () => {const s = slots.get(idx); s.liked = s.liked === 1 ? 0 : 1; $('#lk').classList.toggle('on', s.liked === 1); L((s.liked ? 'like ' : 'unlike ') + s.v.title)};
    $('#dl').onclick = () => {const s = slots.get(idx); s.liked = -1; L('dislike ' + s.v.title); toast('Got it. Showing fewer like this.'); go(1)};
    $('#rp').onclick = replay; $('#nx').onclick = () => go(1);

    /* ---- Feed page: nothing is built or played until the player picks a game ---- */
    const hue = id => [...id].reduce((a, c) => (a * 31 + c.charCodeAt(0)) % 360, 7);
    function renderList() {
      $('#sub').textContent = 'Library: ' + LIST.length + ' games\nPick one to jump into the endless feed.';
      $('#list').innerHTML = LIST.map((gm, i) => {
        const b = BASES[gm.id], chips = Object.entries(b.t).sort((x, y) => y[1] - x[1]).slice(0, 3).map(x => '<em>' + esc(x[0]) + '</em>').join('');
        return '<button class="card" role="listitem" data-i="' + i + '"><span class="ico" style="--h:' + hue(gm.id) + '">' + esc(b.icon || gm.title.trim().charAt(0).toUpperCase()) +
          '</span><span class="txt"><b>' + esc(gm.title) + '</b><span class="desc">' + esc(b.desc || 'A micro-game from the library.') + '</span><span class="chips">' + chips +
          '</span></span><span class="go" aria-hidden="true">▶</span></button>';
      }).join('');
      $('#pl').disabled = false;
    }

    // Optionally record a taste signal, then drop every iframe and timer.
    function teardown(includeEngagement = true) {
      leave(slots.get(idx), includeEngagement);
      for (const s of slots.values()) {clearTimeout(s.lt); clearTimeout(s.et); clearTimeout(s.at); if (s.fr) s.fr.remove(); s.el.remove()}
      slots.clear(); queue = []; idx = 0; busy = false; dir = {x: 0, y: 0, active: false};
    }

    function openFeed(base) { // base = library id to open first; undefined = taste-routed pick
      teardown(); view = 'play'; closePanel(); $('#home').hidden = true;
      queue[0] = base ? variant(base) : route();
      layout(); activate(slots.get(0));
      toast('Flick up for the next game · tap · hold · drag');
    }

    function showHome() {
      teardown(false); view = 'home'; closePanel(); showEnd(0);
      $('#bar i').style.width = '0'; $('#sc').textContent = ''; $('#cap').innerHTML = ''; $('#home').hidden = false;
    }

    $('#list').onclick = e => {const c = e.target.closest('.card'); if (c) openFeed(LIST[+c.dataset.i].id)};
    $('#feedBtn').onclick = showHome;
    $('#pf').onclick = () => openPanel('prof'); $('#sp').onclick = () => openPanel('spec');
    $('#pl').onclick = () => openFeed(); $('#hm').onclick = showHome;
    loadTasteProfile();
    requestAnimationFrame(loop);
    loadLibrary().then(() => {renderList(); openFeed()})
      .catch(e => {$('#home').hidden = false; $('#sub').textContent = ''; $('#list').innerHTML = '<p class="note"><b>Library not found.</b> Serve this folder over http (for example: python3 -m http.server) so Library/manifest.json can load.</p>'});
  </script>
</body>

</html>
