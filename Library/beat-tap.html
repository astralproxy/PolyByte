<!-- microfeed: {"title": "Beat Tap", "icon": "🥁", "description": "Tap the lanes in time with the falling notes and keep your combo alive.", "tags": {"Rhythm": 1, "Music": 0.8, "Precision": 0.5}} -->
<script>
/* Rhythm: tap a lane as each note crosses the line. Perfect < 70 ms, Good < 180 ms. */
window.GameMeta={title:'Beat Tap',gameLength:15000};
var W=360,H=640,R=mul(PARAMS.seed),B=60/(100+(R()*40|0)),notes=[],t=0,score=0,combo=0,hits=0,fl=[0,0,0],msg='',mt=0,Y=540;
function mul(a){return function(){a|=0;a=a+0x6D2B79F5|0;var x=Math.imul(a^a>>>15,1|a);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296}}
for(var tm=1.5;tm<13;tm+=B)if(R()<.8)notes.push({t:tm,l:(R()*3)|0,s:0});
function updateGame(dt){
  t+=dt;mt-=dt;for(var i=0;i<3;i++)fl[i]-=dt;
  notes.forEach(function(n){if(!n.s&&t>n.t+.18){n.s=2;combo=0;msg='Miss';mt=.4}});
  if(t>13.5&&notes.every(function(n){return n.s}))Platform.endGame();
}
function hitLane(l){
  fl[l]=.12;
  var n=notes.filter(function(n){return !n.s&&n.l===l&&Math.abs(n.t-t)<.18}).sort(function(a,b){return Math.abs(a.t-t)-Math.abs(b.t-t)})[0];
  if(!n)return;
  var d=Math.abs(n.t-t);n.s=1;hits++;combo++;score+=(d<.07?100:50)+combo*5;msg=d<.07?'Perfect':'Good';mt=.4;
}
function handleInput(e){
  if(e.type==='ACTION_PRIMARY'){hitLane(Math.min(2,Math.max(0,(e.x*3)|0)));return}
  if(e.type==='DIRECTIONAL_VECTOR'&&e.active){
    var l=e.x<0?0:e.y<0?1:e.x>0?2:-1;
    if(l>=0)hitLane(l);
  }
}
function renderAll(c){
  var h=PARAMS.hue;c.fillStyle='hsl('+h+',45%,9%)';c.fillRect(0,0,W,H);
  for(var i=0;i<3;i++){c.fillStyle=fl[i]>0?'hsla('+h+',80%,60%,.35)':'rgba(255,255,255,.05)';c.fillRect(i*120+4,0,112,H)}
  c.fillStyle='#fff';c.fillRect(0,Y,W,3);
  notes.forEach(function(n){if(n.s===1)return;var y=Y-(n.t-t)/1.2*480;if(y<-20||y>H)return;c.fillStyle=n.s?'#555':'hsl('+((h+n.l*60)%360)+',90%,60%)';c.fillRect(n.l*120+14,y-14,92,28)});
  c.fillStyle='#fff';c.font='bold 26px system-ui';c.fillText(score,16,44);c.font='15px system-ui';c.fillText(combo>1?combo+' combo':'',16,66);
  if(mt>0){c.textAlign='center';c.font='bold 24px system-ui';c.fillText(msg,180,Y+50);c.textAlign='left'}
}
function getResult(){return{score:score,timeElapsed:t,completionPercent:notes.length?hits/notes.length*100:0,customData:{hits:hits,total:notes.length,bpm:Math.round(60/B)}}}
</script>
