<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>SLIMEBALL - 8-Bit Arcade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    :root {
      --bg-dark: #100e1c;
      --cabinet-trim: #2b2740;
      --accent-green: #4ade80;
      --accent-orange: #fb923c;
    }

    * {

    }

    html, body {
      margin: 0;

    }

    /* Top Control Bar (CRT & Sound Toggles) */
    #top-bar {
      width: 100%;

      border: 2px solid #475569;

    .pixel-btn:active {

    .pixel-btn.active {

    /* Screen Bezel */
    #screen-container {

      box-shadow:
        0 0 0 3px #0f172a,
        0 12px 30px rgba(0, 0, 0, 0.8),

    canvas {

    /* Optional CRT Scanlines Overlay */
    #crt-overlay {
      position: absolute;

      background: linear-gradient(

    /* Touch / On-Screen Arcade Controls */
    #touch-controls {

    .jump-btn:active,

<body>
  <div id="arcade-wrapper">
    <!-- Top Utility Header -->
    <div id="top-bar">
      <div class="arcade-title-badge">SLIMEBALL '88</div>
      <div class="util-buttons">
        <button id="btn-crt" class="pixel-btn active" title="Toggle CRT Scanlines">CRT:ON</button>
        <button id="btn-mute" class="pixel-btn active" title="Toggle 8-Bit Audio">SFX:ON</button>
      </div>
    </div>

    <!-- Main 4:3 Retro CRT Monitor -->
    <div id="screen-container">
      <canvas id="gameCanvas" width="320" height="240"></canvas>
      <div id="crt-overlay"></div>
    </div>

    <!-- Tactile On-Screen Arcade Deck -->
    <div id="touch-controls">
      <div class="dpad-group">
        <button id="btn-left" class="arcade-pad-btn" aria-label="Move Left">◀</button>
        <button id="btn-right" class="arcade-pad-btn" aria-label="Move Right">▶</button>
      </div>
      <div class="hint-text" style="font-size: 8px; color: #64748b; text-align: center; display: none;" id="desktop-hint">
        ARROWS / WASD + SPACE
      </div>
      <button id="btn-jump" class="arcade-pad-btn jump-btn" aria-label="Jump">JUMP</button>
    </div>
  </div>

  <script>
    /**
     * SLIMEBALL - 8-BIT RETRO ARCADE GAME
     * Pure procedural pixel-art renderer, custom 2D circle-dome & rim physics,
     * and Web Audio API chiptune synthesizer in a single self-contained file.
     */

    // =========================================================================
    // 1. WEB AUDIO API 8-BIT CHIPTUNE SOUND SYNTHESIZER
    // =========================================================================
    class RetroAudio {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            this.ctx = new AudioCtx();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playTone(freqStart, freqEnd, duration, type = 'square', volume = 0.12, delay = 0) {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime + delay;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = type;
        osc.frequency.setValueAtTime(freqStart, now);
        if (freqEnd !== freqStart) {
          osc.frequency.exponentialRampToValueAtTime(Math.max(20, freqEnd), now + duration);
        }

        gain.gain.setValueAtTime(volume, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + duration);
      }

      // Squishy slime jump sound
      jump() {
        this.playTone(150, 440, 0.14, 'square', 0.10);
        this.playTone(110, 320, 0.14, 'triangle', 0.12);
      }

      // Slime head bounce ("BOING!")
      slimeBounce(intensity = 1) {
        const base = 220 + Math.min(120, intensity * 40);
        this.playTone(base, base * 1.9, 0.12, 'triangle', 0.18);
        this.playTone(base * 0.75, base * 1.4, 0.10, 'square', 0.08);
      }

      // Metallic rim clank
      rimHit() {
        this.playTone(580, 290, 0.07, 'square', 0.11);
        this.playTone(820, 410, 0.05, 'sawtooth', 0.07);
      }

      // Backboard thud
      backboardHit() {
        this.playTone(180, 95, 0.08, 'triangle', 0.14);
      }

      // Floor dribble bounce
      floorBounce(speed) {
        const vol = Math.min(0.14, Math.max(0.02, speed * 0.025));
        this.playTone(135, 70, 0.07, 'triangle', vol);
      }

      // Classic 8-bit victory arpeggio on scoring a basket
      score(isSwish = false, combo = 1) {
        const pitchBoost = 1 + Math.min(0.35, (combo - 1) * 0.06);
        const notes = isSwish
          ? [523.25, 659.25, 783.99, 1046.50, 1318.51] // C5 E5 G5 C6 E6
          : [523.25, 659.25, 783.99, 1046.50];          // C5 E5 G5 C6

        notes.forEach((freq, idx) => {
          this.playTone(freq * pitchBoost, freq * pitchBoost, 0.09, 'square', 0.12, idx * 0.065);
        });
      }

      // Serve whistle / blip
      serve() {
        this.playTone(660, 880, 0.06, 'square', 0.07);
      }

      // Countdown tick (last 5 seconds)
      tick(urgent = false) {
        this.playTone(urgent ? 880 : 440, urgent ? 880 : 440, 0.05, 'square', 0.08);
      }

      // Game Over retro jingle
      gameOver() {
        const melody = [
          { f: 440, d: 0.14, t: 0.00 },
          { f: 415.3, d: 0.14, t: 0.15 },
          { f: 392.0, d: 0.14, t: 0.30 },
          { f: 349.23, d: 0.38, t: 0.45 }
        ];
        melody.forEach(n => {
          this.playTone(n.f, n.f * 0.96, n.d, 'sawtooth', 0.12, n.t);
        });
      }
    }

    const sfx = new RetroAudio();

    // =========================================================================
    // 2. CANVAS & GAME CONSTANTS (LOW-RES 320x240 8-BIT INTERNAL BUFFER)
    // =========================================================================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const WIDTH = 320;
    const HEIGHT = 240;
    const FLOOR_Y = 212;
    const GAME_DURATION = 60; // 60-second arcade clock

    // 8-Bit NES/SNES Inspired Color Palette
    const PALETTE = {
      skyTop: '#161b33',
      skyMid: '#242f54',
      wallUpper: '#2b3a67',
      wallLower: '#1e2749',
      wallTrim: '#475b99',
      windowGlass: '#3b82f6',
      windowHighlight: '#93c5fd',
      floorTop: '#c87d4b',
      floorMid: '#a85f32',
      floorDark: '#7a401e',
      floorLine: '#f3d2b3',
      slimeDark: '#15803d',
      slimeMain: '#22c55e',
      slimeLight: '#86efac',
      slimeSpec: '#ffffff',
      ballDark: '#9a3412',
      ballMain: '#ea580c',
      ballLight: '#fb923c',
      ballSeam: '#29150c',
      rimDark: '#991b1b',
      rimMain: '#ef4444',
      rimLight: '#fca5a5',
      netColor: '#f1f5f9',
      netShadow: '#94a3b8'
    };

    // =========================================================================
    // 3. GAME STATE & ENTITIES
    // =========================================================================
    const STATE = {
      TITLE: 0,
      PLAYING: 1,
      GAMEOVER: 2
    };

    let gameState = STATE.TITLE;
    let score = 0;
    let highScore = parseInt(localStorage.getItem('slimeball_highscore') || '0', 10);
    let basketsMade = 0;
    let combo = 0;
    let timeLeft = GAME_DURATION;
    let lastSecondInt = GAME_DURATION;
    let frameCount = 0;
    let screenShake = 0;

    // Input State
    const keys = {
      left: false,
      right: false,
      up: false
    };

    // Slime Player Entity
    const slime = {
      x: 92,
      y: FLOOR_Y,
      vx: 0,
      vy: 0,
      baseRadius: 21,
      scaleX: 1,
      scaleY: 1,
      grounded: true,
      facing: 1,
      blinkTimer: 0
    };

    // Basketball Entity
    const ball = {
      x: 105,
      y: 70,
      vx: 0,
      vy: 0,
      radius: 9,
      rotation: 0,
      vRot: 0,
      active: true,
      scoredThisShot: false,
      touchedRim: false,
      touchedBackboard: false,
      trail: [],
      serveTimer: 0,
      serveTargetX: 105
    };

    // Basketball Hoop Entity (Right side of court)
    const hoop = {
      x: 264,          // Center X of the rim opening
      y: 118,          // Current Y height of rim
      targetY: 118,    // Target Y for smooth height transitions
      rimRadius: 21,   // Wider half-width of hoop opening for easier scoring
      rimThickness: 3,
      boardX: 291,     // Front face of backboard
      boardWidth: 6,
      boardTop: 78,
      boardBottom: 130,
      netSwish: 0,     // Animation timer when ball passes through net
      netSway: 0
    };

    // Visual Effects Arrays
    let particles = [];
    let floatingTexts = [];

    // =========================================================================
    // 4. PARTICLE & FLOATING TEXT HELPERS
    // =========================================================================
    function spawnParticles(x, y, color, count = 8, speed = 2.2, gravity = 0.1) {
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.6;
        const spd = speed * (0.5 + Math.random() * 0.8);
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd - 0.5,
          life: 18 + Math.floor(Math.random() * 14),
          maxLife: 32,
          color,
          size: Math.random() > 0.4 ? 2 : 3,
          gravity
        });
      }
    }

    function spawnFloatingText(x, y, text, color = '#fde047') {
      floatingTexts.push({
        x,
        y,
        vy: -0.75,
        text,
        color,
        life: 48
      });
    }

    // =========================================================================
    // 5. GAME FLOW & RESET LOGIC
    // =========================================================================
    function startGame() {
      sfx.init();
      score = 0;
      basketsMade = 0;
      combo = 0;
      timeLeft = GAME_DURATION;
      lastSecondInt = GAME_DURATION;
      particles = [];
      floatingTexts = [];

      // Reset Slime
      slime.x = 92;
      slime.y = FLOOR_Y;
      slime.vx = 0;
      slime.vy = 0;
      slime.scaleX = 1;
      slime.scaleY = 1;
      slime.grounded = true;

      // Reset Hoop to comfortable mid-height
      hoop.y = 118;
      hoop.targetY = 118;
      hoop.netSwish = 0;

      gameState = STATE.PLAYING;
      scheduleServe(105, true);
    }

    function scheduleServe(xPos = 105, immediate = false) {
      ball.active = false;
      ball.serveTimer = immediate ? 10 : 26;
      ball.serveTargetX = Math.max(55, Math.min(185, xPos));
      ball.x = ball.serveTargetX;
      ball.y = 44;
      ball.vx = 0;
      ball.vy = 0;
      ball.trail = [];
    }

    function releaseBall() {
      ball.active = true;
      ball.x = ball.serveTargetX;
      ball.y = 46;
      ball.vx = (Math.random() - 0.5) * 0.25;
      ball.vy = 0.25;
      ball.vRot = (Math.random() - 0.5) * 0.04;
      ball.scoredThisShot = false;
      ball.touchedRim = false;
      ball.touchedBackboard = false;
      sfx.serve();
      spawnParticles(ball.x, ball.y, '#93c5fd', 6, 1.5, 0);
    }

    // =========================================================================
    // 6. PHYSICS & COLLISION ENGINE
    // =========================================================================
    function resolveCircleCollision(cx, cy, cr, restitution = 0.85, isRim = false) {
      const dx = ball.x - cx;
      const dy = ball.y - cy;
      const dist = Math.hypot(dx, dy);
      const minDist = ball.radius + cr;

      if (dist < minDist && dist > 0.0001) {
        const nx = dx / dist;
        const ny = dy / dist;

        // Separate ball from obstacle
        const overlap = minDist - dist;
        ball.x += nx * overlap;
        ball.y += ny * overlap;

        // Relative velocity along normal
        const vn = ball.vx * nx + ball.vy * ny;
        if (vn < 0) {
          ball.vx -= (1 + restitution) * vn * nx;
          ball.vy -= (1 + restitution) * vn * ny;
          ball.vRot = ball.vx * 0.05;

          if (isRim) {
            ball.touchedRim = true;
            sfx.rimHit();
            spawnParticles(cx, cy, '#fca5a5', 5, 1.4, 0.08);
          }
          return true;
        }
      }
      return false;
    }

    function updateGame(dt) {
      frameCount++;

      // Decay screen shake
      if (screenShake > 0) screenShake--;

      // Update Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }

      // Update Floating Texts
      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y += ft.vy;
        ft.life--;
        if (ft.life <= 0) floatingTexts.splice(i, 1);
      }

      // Title Screen Attract Animation (Slime hops happily)
      if (gameState === STATE.TITLE) {
        slime.x = 120 + Math.sin(frameCount * 0.04) * 35;
        slime.facing = Math.cos(frameCount * 0.04) >= 0 ? 1 : -1;
        if (slime.grounded && frameCount % 75 === 0) {
          slime.vy = -4.2;
          slime.grounded = false;
          slime.scaleX = 0.78;
          slime.scaleY = 1.24;
        }
        slime.vy += 0.25;
        slime.y += slime.vy;
        if (slime.y >= FLOOR_Y) {
          if (!slime.grounded) {
            slime.scaleX = 1.25;
            slime.scaleY = 0.76;
          }
          slime.y = FLOOR_Y;
          slime.vy = 0;
          slime.grounded = true;
        }
        slime.scaleX += (1 - slime.scaleX) * 0.18;
        slime.scaleY += (1 - slime.scaleY) * 0.18;
        return;
      }

      if (gameState !== STATE.PLAYING) return;

      // -----------------------------------------------------------------------
      // A. Arcade Clock Countdown
      // -----------------------------------------------------------------------
      timeLeft -= dt;
      const ceilTime = Math.ceil(timeLeft);
      if (ceilTime < lastSecondInt && ceilTime > 0) {
        lastSecondInt = ceilTime;
        if (ceilTime <= 5) {
          sfx.tick(true);
        } else if (ceilTime <= 10) {
          sfx.tick(false);
        }
      }

      if (timeLeft <= 0) {
        timeLeft = 0;
        gameState = STATE.GAMEOVER;
        if (score > highScore) {
          highScore = score;
          localStorage.setItem('slimeball_highscore', String(highScore));
        }
        sfx.gameOver();
        return;
      }

      // -----------------------------------------------------------------------
      // B. Hoop Smooth Vertical Adjustment & Net Animation
      // -----------------------------------------------------------------------
      hoop.y += (hoop.targetY - hoop.y) * 0.08;
      hoop.boardTop = Math.round(hoop.y - 40);
      hoop.boardBottom = Math.round(hoop.y + 12);

      if (hoop.netSwish > 0) {
        hoop.netSwish--;
      }

      // -----------------------------------------------------------------------
      // C. Slime Player Movement & Squash-Stretch Physics
      // -----------------------------------------------------------------------
      const moveSpeed = 3.35;
      const accel = slime.grounded ? 0.55 : 0.38;
      let targetVx = 0;

      if (keys.left) {
        targetVx -= moveSpeed;
        slime.facing = -1;
      }
      if (keys.right) {
        targetVx += moveSpeed;
        slime.facing = 1;
      }

      slime.vx += (targetVx - slime.vx) * accel;
      if (Math.abs(slime.vx) < 0.05) slime.vx = 0;

      // Jump Trigger
      if (keys.up && slime.grounded) {
        slime.vy = -6.4;
        slime.grounded = false;
        slime.scaleX = 0.74;
        slime.scaleY = 1.28;
        sfx.jump();
        spawnParticles(slime.x, FLOOR_Y, '#86efac', 5, 1.3, 0.05);
      }

      // Gravity on Slime
      slime.vy += 0.30;
      slime.x += slime.vx;
      slime.y += slime.vy;

      // Court Boundaries for Slime (Can roam almost up to the hoop)
      const minSlimeX = slime.baseRadius + 6;
      const maxSlimeX = hoop.x - hoop.rimRadius - 10;
      if (slime.x < minSlimeX) {
        slime.x = minSlimeX;
        slime.vx = 0;
      } else if (slime.x > maxSlimeX) {
        slime.x = maxSlimeX;
        slime.vx = 0;
      }

      // Floor Landing for Slime
      if (slime.y >= FLOOR_Y) {
        if (!slime.grounded && slime.vy > 1.5) {
          slime.scaleX = 1.28;
          slime.scaleY = 0.74;
        }
        slime.y = FLOOR_Y;
        slime.vy = 0;
        slime.grounded = true;
      }

      // Spring-back Squash & Stretch Recovery
      slime.scaleX += (1 - slime.scaleX) * 0.18;
      slime.scaleY += (1 - slime.scaleY) * 0.18;

      // Blinking animation
      if (slime.blinkTimer > 0) {
        slime.blinkTimer--;
      } else if (Math.random() < 0.006) {
        slime.blinkTimer = 7;
      }

      // -----------------------------------------------------------------------
      // D. Ball Serve Timer & Air Physics
      // -----------------------------------------------------------------------
      if (!ball.active) {
        ball.serveTimer--;
        if (ball.serveTimer <= 0) {
          releaseBall();
        }
        return;
      }

      const prevBallY = ball.y;

      // Record motion trail for high-speed shots
      if (frameCount % 2 === 0) {
        ball.trail.push({ x: ball.x, y: ball.y });
        if (ball.trail.length > 5) ball.trail.shift();
      }

      // Lighter Gravity & Minimal Air Drag for a floatier, easier-to-read arc
      ball.vy += 0.135;
      ball.vx *= 0.9985;
      ball.vy *= 0.9985;

      // Cap max speed to prevent tunneling
      const maxBallSpeed = 8.5;
      const currentSpeed = Math.hypot(ball.vx, ball.vy);
      if (currentSpeed > maxBallSpeed) {
        ball.vx = (ball.vx / currentSpeed) * maxBallSpeed;
        ball.vy = (ball.vy / currentSpeed) * maxBallSpeed;
      }

      ball.x += ball.vx;
      ball.y += ball.vy;
      ball.rotation += ball.vRot;

      // -----------------------------------------------------------------------
      // E. Slime Dome Head Collision (Circle-vs-Dome Physics)
      // -----------------------------------------------------------------------
      // Slightly generous dome hitbox so headers feel super responsive
      const domeRadius = (slime.baseRadius + 2) * ((slime.scaleX + slime.scaleY) * 0.5);
      const domeCenterX = slime.x;
      const domeCenterY = slime.y - domeRadius * 0.58;

      const dx = ball.x - domeCenterX;
      const dy = ball.y - domeCenterY;
      const dist = Math.hypot(dx, dy);
      const minDist = domeRadius + ball.radius;

      // Collide primarily with the upper hemisphere/dome of the slime
      if (dist < minDist && dist > 0.001 && ball.y <= slime.y + 3) {
        const nx = dx / dist;
        const ny = dy / dist;

        // Push ball out of slime dome
        const overlap = minDist - dist;
        ball.x += nx * overlap;
        ball.y += ny * overlap;

        // Calculate incoming relative velocity
        const relVx = ball.vx - slime.vx;
        const relVy = ball.vy - slime.vy;
        const dot = relVx * nx + relVy * ny;

        if (dot < 0) {
          // Moderate-restitution slime pop + slime momentum transfer
          const restitution = 0.86;
          ball.vx = relVx - (1 + restitution) * dot * nx + slime.vx * 0.55;
          ball.vy = relVy - (1 + restitution) * dot * ny + slime.vy * 0.5;

          // Guarantee a controlled upward launch when heading the ball
          if (ny < -0.1 && ball.vy > -3.6) {
            ball.vy = -3.6 - Math.abs(slime.vy) * 0.35;
          }

          // Gentle smart aim-assist toward the hoop when striking on the forward side
          if (nx > -0.15 && nx < 0.85) {
            const distToHoopX = hoop.x - ball.x;
            const idealVx = Math.max(1.3, Math.min(3.1, distToHoopX * 0.0165));
            ball.vx = ball.vx * 0.55 + idealVx * 0.45;
          }

          ball.vRot = ball.vx * 0.045;

          // Squash slime on impact!
          slime.scaleX = 1.28;
          slime.scaleY = 0.72;

          sfx.slimeBounce(Math.abs(dot));
          spawnParticles(ball.x - nx * ball.radius, ball.y - ny * ball.radius, '#86efac', 7, 1.8, 0.08);
        }
      }

      // -----------------------------------------------------------------------
      // F. Backboard, Rim & Basket Scoring Physics
      // -----------------------------------------------------------------------
      // 1. Backboard AABB vs Ball Circle Collision
      const bbLeft = hoop.boardX;
      const bbRight = hoop.boardX + hoop.boardWidth;
      const bbTop = hoop.boardTop;
      const bbBottom = hoop.boardBottom;

      const closestX = Math.max(bbLeft, Math.min(ball.x, bbRight));
      const closestY = Math.max(bbTop, Math.min(ball.y, bbBottom));
      const bDx = ball.x - closestX;
      const bDy = ball.y - closestY;
      const bDist = Math.hypot(bDx, bDy);

      if (bDist < ball.radius) {
        if (bDist > 0.0001) {
          const bnx = bDx / bDist;
          const bny = bDy / bDist;
          ball.x += bnx * (ball.radius - bDist);
          ball.y += bny * (ball.radius - bDist);

          const vn = ball.vx * bnx + ball.vy * bny;
          if (vn < 0) {
            ball.vx -= (1 + 0.82) * vn * bnx;
            ball.vy -= (1 + 0.82) * vn * bny;
            ball.touchedBackboard = true;
            sfx.backboardHit();
            spawnParticles(closestX, closestY, '#ffffff', 5, 1.2, 0.06);
          }
        } else {
          // Fallback if center is inside backboard
          ball.x = bbLeft - ball.radius;
          ball.vx = -Math.abs(ball.vx) * 0.82;
          ball.touchedBackboard = true;
          sfx.backboardHit();
        }
      }

      // 2. Left & Right Rim Edge Collisions (Two solid circular endpoints)
      const leftRimX = hoop.x - hoop.rimRadius;
      const rightRimX = hoop.x + hoop.rimRadius;
      const rimY = hoop.y;

      resolveCircleCollision(leftRimX, rimY, 2.2, 0.82, true);
      resolveCircleCollision(rightRimX, rimY, 2.2, 0.82, true);

      // 3. Basket Scoring Detection (Ball crosses rim plane downward inside rim)
      if (
        !ball.scoredThisShot &&
        ball.vy > 0 &&
        prevBallY <= rimY &&
        ball.y >= rimY &&
        ball.x > leftRimX + 2 &&
        ball.x < rightRimX - 2
      ) {
        ball.scoredThisShot = true;
        basketsMade++;
        combo++;

        // Calculate Points: Clean Swish or Bank Shot grants +3, standard +2, plus combo bonus
        const isSwish = !ball.touchedRim && !ball.touchedBackboard;
        const isBank = !ball.touchedRim && ball.touchedBackboard;
        let pts = (isSwish || isBank) ? 3 : 2;
        if (combo > 1) pts += Math.min(3, combo - 1);

        score += pts;
        if (score > highScore) {
          highScore = score;
          localStorage.setItem('slimeball_highscore', String(highScore));
        }

        // Trigger Net Swish & Audio/Visual Celebration
        hoop.netSwish = 22;
        hoop.netSway = ball.vx * 1.4;
        ball.vx *= 0.45; // Net slows horizontal drift cleanly
        ball.vy *= 0.75;

        sfx.score(isSwish, combo);
        screenShake = isSwish ? 5 : 3;

        const label = isSwish ? `SWISH! +${pts}` : isBank ? `BANK! +${pts}` : `+${pts}`;
        const labelColor = isSwish ? '#fde047' : isBank ? '#38bdf8' : '#4ade80';
        spawnFloatingText(hoop.x - 6, hoop.y - 14, label, labelColor);
        spawnParticles(hoop.x, hoop.y + 6, labelColor, 14, 2.5, 0.08);

        // Dynamic Hoop Progression: Gentle height shifts after every 3 baskets
        if (basketsMade % 3 === 0) {
          const heights = [104, 118, 128, 110];
          const nextH = heights[(basketsMade / 3) % heights.length];
          hoop.targetY = nextH;
        }
      }

      // -----------------------------------------------------------------------
      // G. Court Walls, Ceiling & Floor Bounds
      // -----------------------------------------------------------------------
      // Left Wall (High bounce retention)
      if (ball.x - ball.radius < 6) {
        ball.x = 6 + ball.radius;
        ball.vx = Math.abs(ball.vx) * 0.92;
        sfx.floorBounce(Math.abs(ball.vx));
      }

      // Right Wall (High bounce retention)
      if (ball.x + ball.radius > WIDTH - 6) {
        ball.x = WIDTH - 6 - ball.radius;
        ball.vx = -Math.abs(ball.vx) * 0.92;
        sfx.floorBounce(Math.abs(ball.vx));
      }

      // Soft High Ceiling (Allow high arcs above screen, cap way up)
      if (ball.y < -45) {
        ball.y = -45;
        ball.vy = Math.abs(ball.vy) * 0.65;
      }

      // Floor Bounce (Super bouncy & retains height much longer!)
      if (ball.y + ball.radius >= FLOOR_Y) {
        ball.y = FLOOR_Y - ball.radius;

        if (ball.scoredThisShot) {
          // Clean reset after scoring a basket!
          sfx.floorBounce(Math.abs(ball.vy));
          spawnParticles(ball.x, FLOOR_Y, '#f3d2b3', 5, 1.2, 0.08);
          scheduleServe(85 + Math.random() * 55, false);
          return;
        }

        if (Math.abs(ball.vy) > 0.9) {
          sfx.floorBounce(Math.abs(ball.vy));
          spawnParticles(ball.x, FLOOR_Y, '#f3d2b3', 4, 1.0, 0.08);
        }

        // Retain 90% of vertical bounce and keep a lively minimum dribble height
        ball.vy = -Math.max(2.9, Math.abs(ball.vy) * 0.90);
        ball.vx *= 0.94;
        ball.vRot = ball.vx * 0.04;

        // Only reset if the ball bounces deep under the hoop on the far right
        if (ball.x > 258) {
          if (combo > 0 && !ball.scoredThisShot) {
            combo = 0;
          }
          scheduleServe(95 + Math.random() * 40, false);
        }
      }
    }

    function drawHoopFrontAndNet() {
      const leftX = hoop.x - hoop.rimRadius;
      const rightX = hoop.x + hoop.rimRadius;
      const topY = hoop.y + 2;

      // Dynamic Net Swish Geometry
      const swishProgress = hoop.netSwish > 0 ? Math.sin((hoop.netSwish / 22) * Math.PI) : 0;
      const netHeight = 19 + swishProgress * 5;
      const bottomSpread = 10 + swishProgress * 6;
      const swayX = swishProgress * (hoop.netSway || 2);

      const botLeftX = hoop.x - bottomSpread + swayX;
      const botRightX = hoop.x + bottomSpread + swayX;
      const botY = topY + netHeight;

      // Draw Crisp Pixel-Art Criss-Cross Net Lines
      ctx.strokeStyle = PALETTE.netShadow;
      ctx.lineWidth = 1;
      const strands = 5;
      for (let i = 0; i <= strands; i++) {
        const t = i / strands;
        const tx = leftX + 2 + (rightX - leftX - 4) * t;
        const bx = botLeftX + (botRightX - botLeftX) * t;

        ctx.beginPath();
        ctx.moveTo(Math.round(tx), Math.round(topY));
        ctx.lineTo(Math.round(bx), Math.round(botY));
        ctx.stroke();
      }

      // Horizontal Net Diamond Cross-ties
      ctx.strokeStyle = PALETTE.netColor;
      for (let row = 1; row <= 3; row++) {
        const rt = row / 3.5;
        const yRow = topY + netHeight * rt;
        const lRow = leftX + 2 + (botLeftX - (leftX + 2)) * rt;
        const rRow = rightX - 2 + (botRightX - (rightX - 2)) * rt;

        ctx.beginPath();
        ctx.moveTo(Math.round(lRow), Math.round(yRow));
        ctx.lineTo(Math.round(rRow), Math.round(yRow));
        ctx.stroke();
      }

      // Foreground Orange/Red Rim Bar
      ctx.fillStyle = PALETTE.rimDark;
      ctx.fillRect(leftX - 1, hoop.y - 1, hoop.rimRadius * 2 + 2, 4);
      ctx.fillStyle = PALETTE.rimMain;
      ctx.fillRect(leftX, hoop.y - 1, hoop.rimRadius * 2, 3);
      ctx.fillStyle = PALETTE.rimLight;
      ctx.fillRect(leftX + 2, hoop.y - 1, hoop.rimRadius * 2 - 4, 1);
    }

    function drawSlime() {
      const rx = Math.round(slime.baseRadius * slime.scaleX);
      const ry = Math.round(slime.baseRadius * slime.scaleY);
      const cx = Math.round(slime.x);
      const baseY = Math.round(slime.y);

      // Ground Contact Shadow
      const heightOffFloor = Math.max(0, FLOOR_Y - baseY);
      const shadowScale = Math.max(0.4, 1 - heightOffFloor / 140);
      ctx.fillStyle = 'rgba(15, 23, 42, 0.45)';
      ctx.fillRect(
        Math.round(cx - rx * shadowScale),
        FLOOR_Y - 1,
        Math.round(rx * 2 * shadowScale),
        3
      );

      // Scanline-by-scanline Pixelated Slime Dome (Crisp 8-bit stair-stepped silhouette)
      for (let dy = 0; dy < ry; dy++) {
        const normY = dy / ry; // 0 at bottom, 1 at top
        // Dome curve: wide flat base, rounded top
        const halfWidth = Math.round(rx * Math.sqrt(Math.max(0, 1 - Math.pow(normY, 2.15))));
        if (halfWidth <= 0) continue;

        const rowY = baseY - dy - 1;

        // 1px Dark Outline
        ctx.fillStyle = '#052e16';
        ctx.fillRect(cx - halfWidth - 1, rowY, halfWidth * 2 + 2, 1);

        // Main Slime Green Fill
        ctx.fillStyle = PALETTE.slimeMain;
        ctx.fillRect(cx - halfWidth, rowY, halfWidth * 2, 1);

        // Bottom & Right Darker Shading
        if (dy < 3) {
          ctx.fillStyle = PALETTE.slimeDark;
          ctx.fillRect(cx - halfWidth, rowY, halfWidth * 2, 1);
        } else if (halfWidth > 4) {
          ctx.fillStyle = PALETTE.slimeDark;
          ctx.fillRect(cx + halfWidth - 3, rowY, 3, 1);
        }

        // Upper-Left Light Green Rim Highlight
        if (normY > 0.45 && halfWidth > 3) {
          ctx.fillStyle = PALETTE.slimeLight;
          ctx.fillRect(cx - halfWidth + 1, rowY, Math.min(4, halfWidth), 1);
        }
      }

      // Top Outline Cap
      ctx.fillStyle = '#052e16';
      ctx.fillRect(cx - 3, baseY - ry - 1, 6, 1);

      // Glossy Specular Pixel Highlights
      ctx.fillStyle = PALETTE.slimeSpec;
      const specX = cx - Math.round(rx * 0.45);
      const specY = baseY - Math.round(ry * 0.68);
      ctx.fillRect(specX, specY, 3, 2);
      ctx.fillRect(specX - 2, specY + 3, 2, 2);

      // Expressive Eyes that Track the Ball
      const lookAngle = Math.atan2(ball.y - (baseY - ry * 0.45), ball.x - cx);
      const pupilOffsetX = Math.round(Math.cos(lookAngle) * 1.5);
      const pupilOffsetY = Math.round(Math.sin(lookAngle) * 1.2);

      const eyeOffsetX = slime.facing * 4;
      const eyeY = baseY - Math.round(ry * 0.44);

      [-5, 5].forEach((offset) => {
        const ex = cx + eyeOffsetX + offset;
        if (slime.blinkTimer > 0) {
          // Cute closed blink line
          ctx.fillStyle = '#052e16';
          ctx.fillRect(ex - 2, eyeY, 5, 1);
        } else {
          // White Sclera
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(ex - 2, eyeY - 2, 5, 5);
          // Dark Pupil
          ctx.fillStyle = '#0f172a';
          ctx.fillRect(ex - 1 + pupilOffsetX, eyeY - 1 + pupilOffsetY, 3, 3);
        }
      });
    }

    function drawBall() {
      // Draw Serve Indicator if waiting to drop
      if (!ball.active && gameState === STATE.PLAYING) {
        const blink = Math.floor(frameCount / 4) % 2 === 0;
        if (blink) {
          const sx = Math.round(ball.serveTargetX);
          ctx.fillStyle = '#fde047';
          ctx.fillRect(sx - 1, 24, 2, 6);
          ctx.fillRect(sx - 3, 28, 6, 1);
          ctx.fillRect(sx - 2, 29, 4, 1);
          ctx.fillRect(sx - 1, 30, 2, 1);
        }
        return;
      }

      // Draw Pixel Motion Trail
      ball.trail.forEach((pt, idx) => {
        const alpha = (idx + 1) / (ball.trail.length + 2) * 0.35;
        ctx.fillStyle = `rgba(251, 146, 60, ${alpha})`;
        const sz = idx + 3;
        ctx.fillRect(Math.round(pt.x - sz / 2), Math.round(pt.y - sz / 2), sz, sz);
      });

      const bx = Math.round(ball.x);
      const by = Math.round(ball.y);
      const r = ball.radius;

      // Floor Shadow under Ball
      const ballDistFloor = Math.max(0, FLOOR_Y - by);
      const bShadowW = Math.max(4, Math.round((r * 1.6) * (1 - ballDistFloor / 220)));
      ctx.fillStyle = 'rgba(15, 23, 42, 0.38)';
      ctx.fillRect(bx - Math.round(bShadowW / 2), FLOOR_Y - 1, bShadowW, 2);

      // Scanline Pixel-Art Basketball
      for (let dy = -r; dy <= r; dy++) {
        const hw = Math.round(Math.sqrt(r * r - dy * dy));
        if (hw <= 0) continue;

        // 1px Dark Outline
        ctx.fillStyle = PALETTE.ballSeam;
        ctx.fillRect(bx - hw - 1, by + dy, hw * 2 + 2, 1);

        // Main Orange Fill
        ctx.fillStyle = PALETTE.ballMain;
        ctx.fillRect(bx - hw, by + dy, hw * 2, 1);

        // Shadow on bottom-right
        if (dy > 2) {
          ctx.fillStyle = PALETTE.ballDark;
          ctx.fillRect(bx - hw + 1, by + dy, hw * 2 - 1, 1);
        }
      }

      // Highlight Pixel Cluster
      ctx.fillStyle = PALETTE.ballLight;
      ctx.fillRect(bx - 4, by - 4, 3, 2);
      ctx.fillRect(bx - 5, by - 2, 2, 2);

      // Animated Rotating Basketball Seams
      ctx.fillStyle = PALETTE.ballSeam;
      const seamShift = Math.round(Math.sin(ball.rotation) * 4);
      const seamShiftY = Math.round(Math.cos(ball.rotation) * 4);
      ctx.fillRect(bx + seamShift, by - r + 2, 1, r * 2 - 4);
      ctx.fillRect(bx - r + 2, by + seamShiftY, r * 2 - 4, 1);
    }

      if (Math.floor(frameCount / 22) % 2 === 0) {
        ctx.fillStyle = '#fde047';
        ctx.font = '8px "Press Start 2P", monospace';
        ctx.fillText('PRESS SPACE OR TAP', WIDTH / 2, 164);
      }
    }

    function drawGameOverOverlay() {
      ctx.fillStyle = 'rgba(10, 12, 24, 0.82)';
      ctx.fillRect(36, 42, WIDTH - 72, 148);
      ctx.strokeStyle = '#ef4444';
      ctx.lineWidth = 2;
      ctx.strokeRect(36, 42, WIDTH - 72, 148);

      ctx.textAlign = 'center';
      ctx.font = '14px "Press Start 2P", monospace';
      ctx.fillStyle = '#ef4444';
      ctx.fillText('TIME UP!', WIDTH / 2, 68);

      ctx.font = '8px "Press Start 2P", monospace';
      ctx.fillStyle = '#f8fafc';
      ctx.fillText(`FINAL SCORE: ${score}`, WIDTH / 2, 96);

      ctx.fillStyle = '#4ade80';
      ctx.fillText(`BASKETS MADE: ${basketsMade}`, WIDTH / 2, 114);

      ctx.fillStyle = '#fde047';
      ctx.fillText(`BEST SCORE: ${highScore}`, WIDTH / 2, 132);

      if (Math.floor(frameCount / 22) % 2 === 0) {
        ctx.fillStyle = '#38bdf8';
        ctx.font = '8px "Press Start 2P", monospace';
        ctx.fillText('SPACE / TAP TO RETRY', WIDTH / 2, 164);
      }
    }

    function render() {
      ctx.save();

      // Apply subtle camera shake on big swishes
      if (screenShake > 0) {
        const sx = Math.round((Math.random() - 0.5) * screenShake);
        const sy = Math.round((Math.random() - 0.5) * screenShake);
        ctx.translate(sx, sy);
      }

      drawBackground();
      drawHoopBack();
      drawSlime();
      drawBall();
      drawHoopFrontAndNet();
      drawParticlesAndText();
      drawHUD();

      if (gameState === STATE.TITLE) {
        drawTitleOverlay();
      } else if (gameState === STATE.GAMEOVER) {
        drawGameOverOverlay();
      }

      ctx.restore();
    }

    // =========================================================================
    // 8. MAIN FIXED-TIMESTEP GAME LOOP
    // =========================================================================
    let lastTime = 0;
    const STEP = 1000 / 60;
    let accumulator = 0;

    function gameLoop(timestamp) {
      if (!lastTime) lastTime = timestamp;
      const frameTime = Math.min(100, timestamp - lastTime);
      lastTime = timestamp;
      accumulator += frameTime;

      while (accumulator >= STEP) {
        updateGame(STEP / 1000);
        accumulator -= STEP;
      }

      render();
      requestAnimationFrame(gameLoop);
    }

    // =========================================================================
    // 9. KEYBOARD, POINTER & TOUCH INPUT HANDLERS
    // =========================================================================
    window.addEventListener('keydown', (e) => {
      if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'Space', ' '].includes(e.key)) {
        e.preventDefault();
      }

      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === ' ') {
        keys.up = true;
        if (gameState !== STATE.PLAYING) {
          startGame();
        }
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === ' ') keys.up = false;
    });

    // Canvas Tap to Start / Restart
    canvas.addEventListener('pointerdown', () => {
      sfx.init();
      if (gameState !== STATE.PLAYING) {
        startGame();
      }
    });

    // Helper to bind on-screen arcade buttons for both touch and mouse
    function bindArcadeButton(btnId, keyName) {
      const btn = document.getElementById(btnId);
      const press = (e) => {
        e.preventDefault();
        sfx.init();
        keys[keyName] = true;
        btn.classList.add('pressed');
        if (keyName === 'up' && gameState !== STATE.PLAYING) {
          startGame();
        }
      };
      const release = (e) => {
        e.preventDefault();
        keys[keyName] = false;
        btn.classList.remove('pressed');
      };

      btn.addEventListener('pointerdown', press);
      btn.addEventListener('pointerup', release);
      btn.addEventListener('pointerleave', release);
      btn.addEventListener('pointercancel', release);
    }

    bindArcadeButton('btn-left', 'left');
    bindArcadeButton('btn-right', 'right');
    bindArcadeButton('btn-jump', 'up');

    // CRT Scanline Toggle
    const btnCrt = document.getElementById('btn-crt');
    const crtOverlay = document.getElementById('crt-overlay');
    let crtEnabled = true;
    btnCrt.addEventListener('click', () => {
      crtEnabled = !crtEnabled;
      crtOverlay.classList.toggle('hidden', !crtEnabled);
      btnCrt.textContent = crtEnabled ? 'CRT:ON' : 'CRT:OFF';
      btnCrt.classList.toggle('active', crtEnabled);
    });

    // Mute Audio Toggle
    const btnMute = document.getElementById('btn-mute');
    btnMute.addEventListener('click', () => {
      sfx.muted = !sfx.muted;
      btnMute.textContent = sfx.muted ? 'SFX:OFF' : 'SFX:ON';
      btnMute.classList.toggle('active', !sfx.muted);
      if (!sfx.muted) sfx.serve();
    });

    // Show keyboard hint on wider desktop screens
    if (window.innerWidth >= 640) {
      document.getElementById('desktop-hint').style.display = 'block';
    }

    // Start Animation Loop on Window Load
    window.onload = () => {
      requestAnimationFrame(gameLoop);
    };
  </script>
</body>
</html>
