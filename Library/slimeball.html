<style>

<script>
  /**
   * SLIMEBALL - 8-BIT RETRO ARCADE GAME
   * PolyByte Creator API v1 compliant (360x640 logical portrait canvas)
   * with full standalone browser fallback.
   */
  window.GameMeta = {
    title: 'Slimeball 8-Bit Arcade',
    gameLength: 25000
  };

  (function () {
    const W = 360;
    const H = 640;
    const FLOOR_Y = 556;
    const TARGET_BASKETS = 5;

    // 8-Bit NES/SNES Inspired Color Palette (adapts subtly to host PARAMS.hue if provided)
    let themeHue = 228;
    const PALETTE = {
      wallUpper: '#2b3a67',
      wallLower: '#1e2749',
      skyMid: '#242f54',
      wallTrim: '#475b99',
      windowGlass: '#3b82f6',
      windowHighlight: '#93c5fd',
      floorTop: '#c87d4b',
      floorMid: '#a85f32',
      floorDark: '#7a401e',
      floorLine: '#f3d2b3',
      slimeDark: '#15803d',
      slimeMain: '#22c55e',
      slimeLight: '#86efac',
      slimeSpec: '#ffffff',
      ballDark: '#9a3412',
      ballMain: '#ea580c',
      ballLight: '#fb923c',
      ballSeam: '#29150c',
      rimDark: '#991b1b',
      rimMain: '#ef4444',
      rimLight: '#fca5a5',
      netColor: '#f1f5f9',
      netShadow: '#94a3b8'
    };

    // =========================================================================
    // 1. WEB AUDIO API 8-BIT CHIPTUNE SOUND SYNTHESIZER
    // =========================================================================
    class RetroAudio {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            this.ctx = new AudioCtx();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
      }

      playTone(freqStart, freqEnd, duration, type = 'square', volume = 0.10, delay = 0) {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        try {
          const now = this.ctx.currentTime + delay;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = type;
          osc.frequency.setValueAtTime(freqStart, now);
          if (freqEnd !== freqStart) {
            osc.frequency.exponentialRampToValueAtTime(Math.max(20, freqEnd), now + duration);
          }

          gain.gain.setValueAtTime(volume, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(now);
          osc.stop(now + duration);
        } catch (e) {}
      }

      jump() {
        this.playTone(150, 440, 0.14, 'square', 0.09);
        this.playTone(110, 320, 0.14, 'triangle', 0.10);
      }

      slimeBounce(intensity = 1) {
        const base = 220 + Math.min(120, intensity * 35);
        this.playTone(base, base * 1.9, 0.12, 'triangle', 0.15);
        this.playTone(base * 0.75, base * 1.4, 0.10, 'square', 0.07);
      }

      rimHit() {
        this.playTone(580, 290, 0.07, 'square', 0.09);
        this.playTone(820, 410, 0.05, 'sawtooth', 0.06);
      }

      backboardHit() {
        this.playTone(180, 95, 0.08, 'triangle', 0.12);
      }

      floorBounce(speed) {
        const vol = Math.min(0.12, Math.max(0.02, speed * 0.015));
        this.playTone(135, 70, 0.07, 'triangle', vol);
      }

      score(isSwish = false, combo = 1) {
        const pitchBoost = 1 + Math.min(0.35, (combo - 1) * 0.06);
        const notes = isSwish
          ? [523.25, 659.25, 783.99, 1046.50, 1318.51]
          : [523.25, 659.25, 783.99, 1046.50];

        notes.forEach((freq, idx) => {
          this.playTone(freq * pitchBoost, freq * pitchBoost, 0.09, 'square', 0.11, idx * 0.065);
        });
      }

      serve() {
        this.playTone(660, 880, 0.06, 'square', 0.06);
      }
    }

    const sfx = new RetroAudio();

    // =========================================================================
    // 2. GAME STATE & ENTITIES (SCALED FOR 360x640 PORTRAIT VIEWPORT)
    // =========================================================================
    let score = 0;
    let basketsMade = 0;
    let combo = 0;
    let timeElapsed = 0;
    let frameCount = 0;
    let screenShake = 0;
    let tutorialTimer = 3.2;

    // Input State (driven by handleInput)
    const inputState = {
      dirX: 0,
      dirY: 0,
      dirActive: false,
      jumpQueued: false,
      dashQueued: false
    };

    // Slime Player Entity
    const slime = {
      x: 112,
      y: FLOOR_Y,
      vx: 0,
      vy: 0,
      baseRadius: 30,
      scaleX: 1,
      scaleY: 1,
      grounded: true,
      facing: 1,
      blinkTimer: 0
    };

    // Basketball Entity
    const ball = {
      x: 126,
      y: 190,
      vx: 0,
      vy: 0,
      radius: 13,
      rotation: 0,
      vRot: 0,
      active: true,
      scoredThisShot: false,
      touchedRim: false,
      touchedBackboard: false,
      trail: [],
      serveTimer: 0,
      serveTargetX: 126
    };

    // Basketball Hoop Entity (Right side of court)
    const hoop = {
      x: 292,          // Center X of rim opening
      y: 332,          // Current Y height of rim
      targetY: 332,    // Target Y for smooth height shifts
      rimRadius: 29,   // Generous rim half-width
      boardX: 332,     // Front face of backboard
      boardWidth: 8,
      boardTop: 268,
      boardBottom: 352,
      netSwish: 0,
      netSway: 0
    };

    let particles = [];
    let floatingTexts = [];

    // =========================================================================
    // 3. PARTICLE & FLOATING TEXT HELPERS
    // =========================================================================
    function spawnParticles(x, y, color, count = 8, speed = 3.2, gravity = 0.14) {
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.6;
        const spd = speed * (0.5 + Math.random() * 0.8);
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd - 0.8,
          life: 20 + Math.floor(Math.random() * 14),
          color,
          size: Math.random() > 0.4 ? 3 : 4,
          gravity
        });
      }
    }

    function spawnFloatingText(x, y, text, color = '#fde047') {
      floatingTexts.push({
        x,
        y,
        vy: -1.1,
        text,
        color,
        life: 52
      });
    }

    // =========================================================================
    // 4. SERVE & COLLISION HELPERS
    // =========================================================================
    function scheduleServe(xPos = 126, immediate = false) {
      ball.active = false;
      ball.serveTimer = immediate ? 8 : 22;
      ball.serveTargetX = Math.max(65, Math.min(205, xPos));
      ball.x = ball.serveTargetX;
      ball.y = 148;
      ball.vx = 0;
      ball.vy = 0;
      ball.trail = [];
    }

    function releaseBall() {
      ball.active = true;
      ball.x = ball.serveTargetX;
      ball.y = 152;
      ball.vx = (Math.random() - 0.5) * 0.35;
      ball.vy = 0.4;
      ball.vRot = (Math.random() - 0.5) * 0.04;
      ball.scoredThisShot = false;
      ball.touchedRim = false;
      ball.touchedBackboard = false;
      sfx.serve();
      spawnParticles(ball.x, ball.y, '#93c5fd', 6, 2.0, 0);
    }

    function resolveCircleCollision(cx, cy, cr, restitution = 0.82, isRim = false) {
      const dx = ball.x - cx;
      const dy = ball.y - cy;
      const dist = Math.hypot(dx, dy);
      const minDist = ball.radius + cr;

      if (dist < minDist && dist > 0.0001) {
        const nx = dx / dist;
        const ny = dy / dist;

        const overlap = minDist - dist;
        ball.x += nx * overlap;
        ball.y += ny * overlap;

        const vn = ball.vx * nx + ball.vy * ny;
        if (vn < 0) {
          ball.vx -= (1 + restitution) * vn * nx;
          ball.vy -= (1 + restitution) * vn * ny;
          ball.vRot = ball.vx * 0.04;

          if (isRim) {
            ball.touchedRim = true;
            sfx.rimHit();
            spawnParticles(cx, cy, '#fca5a5', 5, 2.0, 0.12);
          }
          return true;
        }
      }
      return false;
    }

    // =========================================================================
    // 5. CREATOR API LIFECYCLE FUNCTIONS
    // =========================================================================
    window.initGame = function (params) {
      if (params && typeof params.hue === 'number') {
        themeHue = params.hue;
        PALETTE.wallUpper = `hsl(${themeHue}, 42%, 28%)`;
        PALETTE.wallLower = `hsl(${themeHue}, 45%, 20%)`;
        PALETTE.skyMid = `hsl(${themeHue}, 44%, 23%)`;
        PALETTE.wallTrim = `hsl(${themeHue}, 38%, 44%)`;
      }

      score = 0;
      basketsMade = 0;
      combo = 0;
      timeElapsed = 0;
      frameCount = 0;
      screenShake = 0;
      tutorialTimer = 3.2;
      particles = [];
      floatingTexts = [];

      inputState.dirX = 0;
      inputState.dirY = 0;
      inputState.dirActive = false;
      inputState.jumpQueued = false;
      inputState.dashQueued = false;

      slime.x = 112;
      slime.y = FLOOR_Y;
      slime.vx = 0;
      slime.vy = 0;
      slime.scaleX = 1;
      slime.scaleY = 1;
      slime.grounded = true;
      slime.facing = 1;

      hoop.y = 332;
      hoop.targetY = 332;
      hoop.netSwish = 0;

      scheduleServe(126, true);
    };

    window.handleInput = function (event) {
      if (!event || typeof event !== 'object') return;
      sfx.init();

      if (event.type === 'ACTION_PRIMARY') {
        inputState.jumpQueued = true;
        // If user taps on left or right side of screen while not dragging, nudge toward tap
        if (!inputState.dirActive && typeof event.x === 'number') {
          const tapX = event.x * W;
          if (Math.abs(tapX - slime.x) > 18) {
            slime.vx += (tapX > slime.x ? 1 : -1) * 2.4;
            slime.facing = tapX > slime.x ? 1 : -1;
          }
        }
      } else if (event.type === 'ACTION_SECONDARY') {
        // Secondary hold/Shift performs a power hop + forward boost
        inputState.jumpQueued = true;
        inputState.dashQueued = true;
      } else if (event.type === 'DIRECTIONAL_VECTOR') {
        inputState.dirActive = !!event.active;
        inputState.dirX = inputState.dirActive ? Math.max(-1, Math.min(1, Number(event.x) || 0)) : 0;
        inputState.dirY = inputState.dirActive ? Math.max(-1, Math.min(1, Number(event.y) || 0)) : 0;
        // Flicking upward on drag also triggers a jump
        if (inputState.dirActive && inputState.dirY < -0.55 && slime.grounded) {
          inputState.jumpQueued = true;
        }
      }
    };

    window.updateGame = function (deltaTime) {
      const dt = Math.min(0.05, Math.max(0.001, deltaTime || (1 / 60)));
      const step = dt * 60; // Normalize physics constants to 60fps
      timeElapsed += dt;
      frameCount++;

      if (tutorialTimer > 0) tutorialTimer = Math.max(0, tutorialTimer - dt);
      if (screenShake > 0) screenShake = Math.max(0, screenShake - step);

      // Update Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * step;
        p.y += p.vy * step;
        p.vy += p.gravity * step;
        p.life -= step;
        if (p.life <= 0) particles.splice(i, 1);
      }

      // Update Floating Texts
      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y += ft.vy * step;
        ft.life -= step;
        if (ft.life <= 0) floatingTexts.splice(i, 1);
      }

      // Smooth Hoop Height Transitions
      hoop.y += (hoop.targetY - hoop.y) * Math.min(1, 0.08 * step);
      hoop.boardTop = Math.round(hoop.y - 64);
      hoop.boardBottom = Math.round(hoop.y + 20);
      if (hoop.netSwish > 0) hoop.netSwish = Math.max(0, hoop.netSwish - step);

      // -----------------------------------------------------------------------
      // A. Slime Player Movement & Squash-Stretch Physics
      // -----------------------------------------------------------------------
      const moveSpeed = 5.2;
      const accel = slime.grounded ? 0.45 : 0.30;
      const targetVx = inputState.dirActive ? inputState.dirX * moveSpeed : 0;

      if (targetVx < -0.2) slime.facing = -1;
      else if (targetVx > 0.2) slime.facing = 1;

      slime.vx += (targetVx - slime.vx) * Math.min(1, accel * step);
      if (Math.abs(slime.vx) < 0.05 && !inputState.dirActive) slime.vx = 0;

      // Jump Trigger
      if (inputState.jumpQueued) {
        inputState.jumpQueued = false;
        if (slime.grounded) {
          slime.vy = inputState.dashQueued ? -11.4 : -10.2;
          if (inputState.dashQueued) {
            slime.vx += slime.facing * 3.8;
          }
          slime.grounded = false;
          slime.scaleX = 0.74;
          slime.scaleY = 1.28;
          sfx.jump();
          spawnParticles(slime.x, FLOOR_Y, '#86efac', 6, 2.0, 0.08);
        }
        inputState.dashQueued = false;
      }

      // Gravity on Slime
      slime.vy += 0.46 * step;
      slime.x += slime.vx * step;
      slime.y += slime.vy * step;

      // Court Boundaries for Slime
      const minSlimeX = slime.baseRadius + 8;
      const maxSlimeX = hoop.x - hoop.rimRadius - 12;
      if (slime.x < minSlimeX) {
        slime.x = minSlimeX;
        slime.vx = 0;
      } else if (slime.x > maxSlimeX) {
        slime.x = maxSlimeX;
        slime.vx = 0;
      }

      // Floor Landing for Slime
      if (slime.y >= FLOOR_Y) {
        if (!slime.grounded && slime.vy > 2.2) {
          slime.scaleX = 1.28;
          slime.scaleY = 0.74;
        }
        slime.y = FLOOR_Y;
        slime.vy = 0;
        slime.grounded = true;
      }

      slime.scaleX += (1 - slime.scaleX) * Math.min(1, 0.18 * step);
      slime.scaleY += (1 - slime.scaleY) * Math.min(1, 0.18 * step);

      if (slime.blinkTimer > 0) {
        slime.blinkTimer -= step;
      } else if (Math.random() < 0.008) {
        slime.blinkTimer = 7;
      }

      // -----------------------------------------------------------------------
      // B. Ball Serve Timer & Air Physics
      // -----------------------------------------------------------------------
      if (!ball.active) {
        ball.serveTimer -= step;
        if (ball.serveTimer <= 0) {
          releaseBall();
        }
        return;
      }

      const prevBallY = ball.y;

      if (frameCount % 2 === 0) {
        ball.trail.push({ x: ball.x, y: ball.y });
        if (ball.trail.length > 5) ball.trail.shift();
      }

      // Floaty, readable arcade arc
      ball.vy += 0.21 * step;
      ball.vx *= Math.pow(0.9985, step);
      ball.vy *= Math.pow(0.9985, step);

      const maxBallSpeed = 13.0;
      const currentSpeed = Math.hypot(ball.vx, ball.vy);
      if (currentSpeed > maxBallSpeed) {
        ball.vx = (ball.vx / currentSpeed) * maxBallSpeed;
        ball.vy = (ball.vy / currentSpeed) * maxBallSpeed;
      }

      ball.x += ball.vx * step;
      ball.y += ball.vy * step;
      ball.rotation += ball.vRot * step;

      // -----------------------------------------------------------------------
      // C. Slime Dome Head Collision (Tuned Moderate Bounce)
      // -----------------------------------------------------------------------
      const domeRadius = (slime.baseRadius + 3) * ((slime.scaleX + slime.scaleY) * 0.5);
      const domeCenterX = slime.x;
      const domeCenterY = slime.y - domeRadius * 0.56;

      const dx = ball.x - domeCenterX;
      const dy = ball.y - domeCenterY;
      const dist = Math.hypot(dx, dy);
      const minDist = domeRadius + ball.radius;

      if (dist < minDist && dist > 0.001 && ball.y <= slime.y + 4) {
        const nx = dx / dist;
        const ny = dy / dist;

        const overlap = minDist - dist;
        ball.x += nx * overlap;
        ball.y += ny * overlap;

        const relVx = ball.vx - slime.vx;
        const relVy = ball.vy - slime.vy;
        const dot = relVx * nx + relVy * ny;

        if (dot < 0) {
          // Moderate bounce off the slime head so shots stay controlled
          const restitution = 0.85;
          ball.vx = relVx - (1 + restitution) * dot * nx + slime.vx * 0.50;
          ball.vy = relVy - (1 + restitution) * dot * ny + slime.vy * 0.45;

          if (ny < -0.1 && ball.vy > -5.8) {
            ball.vy = -5.8 - Math.abs(slime.vy) * 0.30;
          }

          // Subtle trajectory assist toward the hoop when heading forward
          if (nx > -0.15 && nx < 0.85) {
            const distToHoopX = hoop.x - ball.x;
            const idealVx = Math.max(1.8, Math.min(4.4, distToHoopX * 0.017));
            ball.vx = ball.vx * 0.55 + idealVx * 0.45;
          }

          ball.vRot = ball.vx * 0.035;
          slime.scaleX = 1.28;
          slime.scaleY = 0.72;

          sfx.slimeBounce(Math.abs(dot) * 0.65);
          spawnParticles(ball.x - nx * ball.radius, ball.y - ny * ball.radius, '#86efac', 8, 2.4, 0.1);
        }
      }

      // -----------------------------------------------------------------------
      // D. Backboard, Rim & Basket Scoring Physics
      // -----------------------------------------------------------------------
      const bbLeft = hoop.boardX;
      const bbRight = hoop.boardX + hoop.boardWidth;
      const bbTop = hoop.boardTop;
      const bbBottom = hoop.boardBottom;

      const closestX = Math.max(bbLeft, Math.min(ball.x, bbRight));
      const closestY = Math.max(bbTop, Math.min(ball.y, bbBottom));
      const bDx = ball.x - closestX;
      const bDy = ball.y - closestY;
      const bDist = Math.hypot(bDx, bDy);

      if (bDist < ball.radius) {
        if (bDist > 0.0001) {
          const bnx = bDx / bDist;
          const bny = bDy / bDist;
          ball.x += bnx * (ball.radius - bDist);
          ball.y += bny * (ball.radius - bDist);

          const vn = ball.vx * bnx + ball.vy * bny;
          if (vn < 0) {
            ball.vx -= (1 + 0.82) * vn * bnx;
            ball.vy -= (1 + 0.82) * vn * bny;
            ball.touchedBackboard = true;
            sfx.backboardHit();
            spawnParticles(closestX, closestY, '#ffffff', 5, 1.8, 0.08);
          }
        } else {
          ball.x = bbLeft - ball.radius;
          ball.vx = -Math.abs(ball.vx) * 0.82;
          ball.touchedBackboard = true;
          sfx.backboardHit();
        }
      }

      const leftRimX = hoop.x - hoop.rimRadius;
      const rightRimX = hoop.x + hoop.rimRadius;
      const rimY = hoop.y;

      resolveCircleCollision(leftRimX, rimY, 3.2, 0.82, true);
      resolveCircleCollision(rightRimX, rimY, 3.2, 0.82, true);

      // Basket Scoring Detection
      if (
        !ball.scoredThisShot &&
        ball.vy > 0 &&
        prevBallY <= rimY &&
        ball.y >= rimY &&
        ball.x > leftRimX + 2 &&
        ball.x < rightRimX - 2
      ) {
        ball.scoredThisShot = true;
        basketsMade++;
        combo++;

        const isSwish = !ball.touchedRim && !ball.touchedBackboard;
        const isBank = !ball.touchedRim && ball.touchedBackboard;
        let pts = (isSwish || isBank) ? 3 : 2;
        if (combo > 1) pts += Math.min(3, combo - 1);

        score += pts;

        hoop.netSwish = 22;
        hoop.netSway = ball.vx * 1.3;
        ball.vx *= 0.45;
        ball.vy *= 0.75;

        sfx.score(isSwish, combo);
        screenShake = isSwish ? 6 : 4;

        const label = isSwish ? `SWISH! +${pts}` : isBank ? `BANK! +${pts}` : `+${pts}`;
        const labelColor = isSwish ? '#fde047' : isBank ? '#38bdf8' : '#4ade80';
        spawnFloatingText(hoop.x - 14, hoop.y - 22, label, labelColor);
        spawnParticles(hoop.x, hoop.y + 8, labelColor, 16, 3.4, 0.1);

        // Shift hoop height every 2 baskets
        if (basketsMade % 2 === 0) {
          const heights = [302, 336, 358, 316];
          hoop.targetY = heights[(basketsMade / 2) % heights.length];
        }
      }

      // -----------------------------------------------------------------------
      // E. Court Walls, Ceiling & High-Retention Floor Bounce
      // -----------------------------------------------------------------------
      if (ball.x - ball.radius < 8) {
        ball.x = 8 + ball.radius;
        ball.vx = Math.abs(ball.vx) * 0.92;
        sfx.floorBounce(Math.abs(ball.vx));
      }

      if (ball.x + ball.radius > W - 8) {
        ball.x = W - 8 - ball.radius;
        ball.vx = -Math.abs(ball.vx) * 0.92;
        sfx.floorBounce(Math.abs(ball.vx));
      }

      if (ball.y < 36) {
        ball.y = 36;
        ball.vy = Math.abs(ball.vy) * 0.72;
      }

      if (ball.y + ball.radius >= FLOOR_Y) {
        ball.y = FLOOR_Y - ball.radius;

        if (ball.scoredThisShot) {
          sfx.floorBounce(Math.abs(ball.vy));
          spawnParticles(ball.x, FLOOR_Y, '#f3d2b3', 6, 1.8, 0.1);
          scheduleServe(105 + Math.random() * 65, false);
          return;
        }

        if (Math.abs(ball.vy) > 1.2) {
          sfx.floorBounce(Math.abs(ball.vy));
          spawnParticles(ball.x, FLOOR_Y, '#f3d2b3', 4, 1.4, 0.1);
        }

        // Ball is super bouncy on the floor and retains 90% of its bounce energy
        ball.vy = -Math.max(4.6, Math.abs(ball.vy) * 0.90);
        ball.vx *= 0.95;
        ball.vRot = ball.vx * 0.03;

        if (ball.x > 286) {
          if (combo > 0 && !ball.scoredThisShot) combo = 0;
          scheduleServe(115 + Math.random() * 55, false);
        }
      }
    };

    window.getResult = function () {
      const completionPercent = Math.min(100, Math.round((basketsMade / TARGET_BASKETS) * 100));
      return {
        score: score,
        timeElapsed: Number(timeElapsed.toFixed(2)),
        completionPercent: completionPercent,
        customData: {
          basketsMade: basketsMade,
          maxCombo: combo
        }
      };
    };

    // =========================================================================
    // 6. 8-BIT PIXEL-ART RENDERER (360x640 LOGICAL RESOLUTION)
    // =========================================================================
    function drawBackground(ctx) {
      // Upper Gymnasium Wall
      ctx.fillStyle = PALETTE.wallUpper;
      ctx.fillRect(0, 0, W, 386);

      // Top Header Ceiling Band (leaves breathing room for host top HUD)
      ctx.fillStyle = PALETTE.skyMid;
      ctx.fillRect(0, 0, W, 94);

      // Clerestory Gym Windows
      for (let wx = 26; wx <= 282; wx += 84) {
        ctx.fillStyle = '#141b33';
        ctx.fillRect(wx - 3, 114, 54, 42);
        ctx.fillStyle = PALETTE.windowGlass;
        ctx.fillRect(wx, 117, 48, 36);
        ctx.fillStyle = PALETTE.windowHighlight;
        ctx.fillRect(wx + 4, 121, 12, 4);
        ctx.fillRect(wx + 4, 127, 6, 4);
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(wx + 23, 117, 3, 36);
        ctx.fillRect(wx, 134, 48, 3);
      }

      // Lower Wainscoting Wall
      ctx.fillStyle = PALETTE.wallTrim;
      ctx.fillRect(0, 384, W, 6);
      ctx.fillStyle = PALETTE.wallLower;
      ctx.fillRect(0, 390, W, FLOOR_Y - 390);

      // Vertical Wall Panels
      ctx.fillStyle = '#171f3b';
      for (let px = 24; px < W; px += 48) {
        ctx.fillRect(px, 392, 3, FLOOR_Y - 392);
      }

      // In-Game Pixel Scoreboard Banner on Back Wall
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(108, 196, 144, 46);
      ctx.strokeStyle = '#475569';
      ctx.lineWidth = 3;
      ctx.strokeRect(109, 197, 142, 44);

      ctx.font = '9px "Press Start 2P", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillStyle = '#94a3b8';
      ctx.fillText('SLIMEBALL', 180, 205);

      ctx.fillStyle = '#4ade80';
      ctx.fillText(`PTS:${String(score).padStart(2, '0')}`, 144, 222);
      ctx.fillStyle = '#fde047';
      ctx.fillText(`${basketsMade}/${TARGET_BASKETS}`, 218, 222);

      // Hardwood Court Floor
      ctx.fillStyle = PALETTE.floorTop;
      ctx.fillRect(0, FLOOR_Y, W, 14);
      ctx.fillStyle = PALETTE.floorMid;
      ctx.fillRect(0, FLOOR_Y + 14, W, 20);
      ctx.fillStyle = PALETTE.floorDark;
      ctx.fillRect(0, FLOOR_Y + 34, W, H - (FLOOR_Y + 34));

      // Floor Planks & Court Lines
      ctx.fillStyle = PALETTE.floorLine;
      ctx.fillRect(0, FLOOR_Y, W, 3);
      ctx.fillRect(180, FLOOR_Y + 3, 4, 11);
      ctx.fillRect(264, FLOOR_Y + 3, 4, 11);

      ctx.fillStyle = '#8c4b23';
      for (let fx = 0; fx < W; fx += 36) {
        ctx.fillRect(fx, FLOOR_Y + 6, 3, 46);
      }
    }

    function drawHoopBack(ctx) {
      // Wall Support Strut
      ctx.fillStyle = '#475569';
      ctx.fillRect(hoop.boardX + hoop.boardWidth, hoop.y - 38, W - hoop.boardX, 8);
      ctx.fillRect(hoop.boardX + hoop.boardWidth, hoop.y - 10, W - hoop.boardX, 8);
      ctx.fillStyle = '#94a3b8';
      ctx.fillRect(hoop.boardX + hoop.boardWidth, hoop.y - 38, W - hoop.boardX, 3);

      // Backboard
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(hoop.boardX - 2, hoop.boardTop - 2, hoop.boardWidth + 4, hoop.boardBottom - hoop.boardTop + 4);
      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(hoop.boardX, hoop.boardTop, hoop.boardWidth, hoop.boardBottom - hoop.boardTop);
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(hoop.boardX, hoop.y - 24, 3, 24);

      // Rim Connector Bracket
      ctx.fillStyle = PALETTE.rimDark;
      ctx.fillRect(hoop.x + hoop.rimRadius - 2, hoop.y - 2, 12, 6);
    }

    function drawHoopFrontAndNet(ctx) {
      const leftX = hoop.x - hoop.rimRadius;
      const rightX = hoop.x + hoop.rimRadius;
      const topY = hoop.y + 3;

      const swishProgress = hoop.netSwish > 0 ? Math.sin((hoop.netSwish / 22) * Math.PI) : 0;
      const netHeight = 28 + swishProgress * 8;
      const bottomSpread = 15 + swishProgress * 8;
      const swayX = swishProgress * (hoop.netSway || 3);

      const botLeftX = hoop.x - bottomSpread + swayX;
      const botRightX = hoop.x + bottomSpread + swayX;
      const botY = topY + netHeight;

      ctx.strokeStyle = PALETTE.netShadow;
      ctx.lineWidth = 2;
      const strands = 5;
      for (let i = 0; i <= strands; i++) {
        const t = i / strands;
        const tx = leftX + 3 + (rightX - leftX - 6) * t;
        const bx = botLeftX + (botRightX - botLeftX) * t;

        ctx.beginPath();
        ctx.moveTo(Math.round(tx), Math.round(topY));
        ctx.lineTo(Math.round(bx), Math.round(botY));
        ctx.stroke();
      }

      ctx.strokeStyle = PALETTE.netColor;
      for (let row = 1; row <= 3; row++) {
        const rt = row / 3.5;
        const yRow = topY + netHeight * rt;
        const lRow = leftX + 3 + (botLeftX - (leftX + 3)) * rt;
        const rRow = rightX - 3 + (botRightX - (rightX - 3)) * rt;

        ctx.beginPath();
        ctx.moveTo(Math.round(lRow), Math.round(yRow));
        ctx.lineTo(Math.round(rRow), Math.round(yRow));
        ctx.stroke();
      }

      // Foreground Rim Bar
      ctx.fillStyle = PALETTE.rimDark;
      ctx.fillRect(leftX - 2, hoop.y - 2, hoop.rimRadius * 2 + 4, 6);
      ctx.fillStyle = PALETTE.rimMain;
      ctx.fillRect(leftX, hoop.y - 1, hoop.rimRadius * 2, 4);
      ctx.fillStyle = PALETTE.rimLight;
      ctx.fillRect(leftX + 3, hoop.y - 1, hoop.rimRadius * 2 - 6, 2);
    }

    function drawSlime(ctx) {
      const rx = Math.round(slime.baseRadius * slime.scaleX);
      const ry = Math.round(slime.baseRadius * slime.scaleY);
      const cx = Math.round(slime.x);
      const baseY = Math.round(slime.y);

      // Ground Contact Shadow
      const heightOffFloor = Math.max(0, FLOOR_Y - baseY);
      const shadowScale = Math.max(0.4, 1 - heightOffFloor / 220);
      ctx.fillStyle = 'rgba(15, 23, 42, 0.45)';
      ctx.fillRect(
        Math.round(cx - rx * shadowScale),
        FLOOR_Y - 1,
        Math.round(rx * 2 * shadowScale),
        4
      );

      // Pixelated Slime Dome (stepped in 2px retro rows for crisp 8-bit look)
      for (let dy = 0; dy < ry; dy += 2) {
        const normY = dy / ry;
        const halfWidth = Math.round((rx * Math.sqrt(Math.max(0, 1 - Math.pow(normY, 2.15)))) / 2) * 2;
        if (halfWidth <= 0) continue;

        const rowY = baseY - dy - 2;

        ctx.fillStyle = '#052e16';
        ctx.fillRect(cx - halfWidth - 2, rowY, halfWidth * 2 + 4, 2);

        ctx.fillStyle = PALETTE.slimeMain;
        ctx.fillRect(cx - halfWidth, rowY, halfWidth * 2, 2);

        if (dy < 4) {
          ctx.fillStyle = PALETTE.slimeDark;
          ctx.fillRect(cx - halfWidth, rowY, halfWidth * 2, 2);
        } else if (halfWidth > 6) {
          ctx.fillStyle = PALETTE.slimeDark;
          ctx.fillRect(cx + halfWidth - 4, rowY, 4, 2);
        }

        if (normY > 0.45 && halfWidth > 4) {
          ctx.fillStyle = PALETTE.slimeLight;
          ctx.fillRect(cx - halfWidth + 2, rowY, Math.min(6, halfWidth), 2);
        }
      }

      // Top Outline Cap
      ctx.fillStyle = '#052e16';
      ctx.fillRect(cx - 4, baseY - ry - 2, 8, 2);

      // Glossy Specular Highlights
      ctx.fillStyle = PALETTE.slimeSpec;
      const specX = cx - Math.round(rx * 0.45);
      const specY = baseY - Math.round(ry * 0.68);
      ctx.fillRect(specX, specY, 4, 3);
      ctx.fillRect(specX - 3, specY + 4, 3, 3);

      // Ball-Tracking Eyes
      const lookAngle = Math.atan2(ball.y - (baseY - ry * 0.45), ball.x - cx);
      const pupilOffsetX = Math.round(Math.cos(lookAngle) * 2);
      const pupilOffsetY = Math.round(Math.sin(lookAngle) * 1.5);

      const eyeOffsetX = slime.facing * 6;
      const eyeY = baseY - Math.round(ry * 0.44);

      [-7, 7].forEach((offset) => {
        const ex = cx + eyeOffsetX + offset;
        if (slime.blinkTimer > 0) {
          ctx.fillStyle = '#052e16';
          ctx.fillRect(ex - 3, eyeY, 7, 2);
        } else {
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(ex - 3, eyeY - 3, 7, 7);
          ctx.fillStyle = '#0f172a';
          ctx.fillRect(ex - 1 + pupilOffsetX, eyeY - 1 + pupilOffsetY, 4, 4);
        }
      });
    }

    function drawBall(ctx) {
      if (!ball.active) {
        const blink = Math.floor(frameCount / 4) % 2 === 0;
        if (blink) {
          const sx = Math.round(ball.serveTargetX);
          ctx.fillStyle = '#fde047';
          ctx.fillRect(sx - 2, 118, 4, 10);
          ctx.fillRect(sx - 6, 126, 12, 2);
          ctx.fillRect(sx - 4, 128, 8, 2);
          ctx.fillRect(sx - 2, 130, 4, 2);
        }
        return;
      }

      // Motion Trail
      ball.trail.forEach((pt, idx) => {
        const alpha = (idx + 1) / (ball.trail.length + 2) * 0.35;
        ctx.fillStyle = `rgba(251, 146, 60, ${alpha})`;
        const sz = (idx + 3) * 1.4;
        ctx.fillRect(Math.round(pt.x - sz / 2), Math.round(pt.y - sz / 2), sz, sz);
      });

      const bx = Math.round(ball.x);
      const by = Math.round(ball.y);
      const r = ball.radius;

      // Floor Shadow
      const ballDistFloor = Math.max(0, FLOOR_Y - by);
      const bShadowW = Math.max(6, Math.round((r * 1.7) * (1 - ballDistFloor / 360)));
      ctx.fillStyle = 'rgba(15, 23, 42, 0.38)';
      ctx.fillRect(bx - Math.round(bShadowW / 2), FLOOR_Y - 1, bShadowW, 3);

      // Pixel-Art Basketball
      for (let dy = -r; dy <= r; dy += 2) {
        const hw = Math.round(Math.sqrt(Math.max(0, r * r - dy * dy)) / 2) * 2;
        if (hw <= 0) continue;

        ctx.fillStyle = PALETTE.ballSeam;
        ctx.fillRect(bx - hw - 2, by + dy, hw * 2 + 4, 2);

        ctx.fillStyle = PALETTE.ballMain;
        ctx.fillRect(bx - hw, by + dy, hw * 2, 2);

        if (dy > 3) {
          ctx.fillStyle = PALETTE.ballDark;
          ctx.fillRect(bx - hw + 2, by + dy, hw * 2 - 2, 2);
        }
      }

      // Highlight Cluster
      ctx.fillStyle = PALETTE.ballLight;
      ctx.fillRect(bx - 6, by - 6, 4, 3);
      ctx.fillRect(bx - 7, by - 3, 3, 3);

      // Rotating Basketball Seams
      ctx.fillStyle = PALETTE.ballSeam;
      const seamShift = Math.round(Math.sin(ball.rotation) * 6);
      const seamShiftY = Math.round(Math.cos(ball.rotation) * 6);
      ctx.fillRect(bx + seamShift, by - r + 2, 2, r * 2 - 4);
      ctx.fillRect(bx - r + 2, by + seamShiftY, r * 2 - 4, 2);
    }

    function drawParticlesAndText(ctx) {
      particles.forEach((p) => {
        ctx.fillStyle = p.color;
        ctx.fillRect(Math.round(p.x), Math.round(p.y), p.size, p.size);
      });

      ctx.font = '10px "Press Start 2P", monospace';
      ctx.textAlign = 'center';
      floatingTexts.forEach((ft) => {
        const tx = Math.round(ft.x);
        const ty = Math.round(ft.y);
        ctx.fillStyle = '#0f172a';
        ctx.fillText(ft.text, tx + 2, ty + 2);
        ctx.fillStyle = ft.color;
        ctx.fillText(ft.text, tx, ty);
      });

      // Subtle On-Court Control Hint during first 3 seconds
      if (tutorialTimer > 0) {
        const alpha = Math.min(1, tutorialTimer);
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = 'rgba(15, 23, 42, 0.72)';
        ctx.fillRect(46, 470, W - 92, 42);
        ctx.strokeStyle = '#4ade80';
        ctx.lineWidth = 2;
        ctx.strokeRect(46, 470, W - 92, 42);

        ctx.font = '8px "Press Start 2P", monospace';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#fde047';
        ctx.fillText('DRAG TO MOVE', W / 2, 480);
        ctx.fillStyle = '#e2e8f0';
        ctx.fillText('TAP / SPACE TO JUMP', W / 2, 496);
        ctx.restore();
      }
    }

    window.renderAll = function (ctx) {
      if (!ctx) {
        const c = document.getElementById('c');
        if (c) ctx = c.getContext('2d');
      }
      if (!ctx) return;

      ctx.save();
      ctx.imageSmoothingEnabled = false;

      if (screenShake > 0) {
        const sx = Math.round((Math.random() - 0.5) * screenShake);
        const sy = Math.round((Math.random() - 0.5) * screenShake);
        ctx.translate(sx, sy);
      }

      drawBackground(ctx);
      drawHoopBack(ctx);
      drawSlime(ctx);
      drawBall(ctx);
      drawHoopFrontAndNet(ctx);
      drawParticlesAndText(ctx);

      ctx.restore();
    };

    // =========================================================================
    // 7. STANDALONE FALLBACK (WHEN OPENED DIRECTLY OUTSIDE HOST SERVER)
    // =========================================================================
    window.addEventListener('DOMContentLoaded', () => {
      if (window.Platform) return; // Host shell manages canvas & loop

      let c = document.getElementById('c');
      if (!c) {
        c = document.createElement('canvas');
        c.id = 'c';
        c.width = W;
        c.height = H;
        c.style.height = '100vh';
        c.style.maxWidth = '100vw';
        c.style.aspectRatio = '9 / 16';
        document.body.appendChild(c);
      }
      const ctx = c.getContext('2d');
      window.initGame(window.PARAMS || {});

      const keysDown = {};
      function updateStandaloneDir() {
        const x = (keysDown.ArrowRight || keysDown.d || keysDown.D ? 1 : 0) -
                  (keysDown.ArrowLeft || keysDown.a || keysDown.A ? 1 : 0);
        window.handleInput({ type: 'DIRECTIONAL_VECTOR', x, y: 0, active: x !== 0 });
      }

      window.addEventListener('keydown', (e) => {
        if (['ArrowLeft', 'ArrowRight', 'ArrowUp', ' '].includes(e.key)) e.preventDefault();
        keysDown[e.key] = true;
        if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
          if (!e.repeat) window.handleInput({ type: 'ACTION_PRIMARY', x: 0.5, y: 0.5 });
        }
        updateStandaloneDir();
      });

      window.addEventListener('keyup', (e) => {
        delete keysDown[e.key];
        updateStandaloneDir();
      });

      let dragStart = null;
      c.addEventListener('pointerdown', (e) => {
        dragStart = { x: e.clientX, y: e.clientY, moved: false };
      });
      c.addEventListener('pointermove', (e) => {
        if (!dragStart) return;
        const dx = e.clientX - dragStart.x;
        if (Math.abs(dx) > 10) dragStart.moved = true;
        if (dragStart.moved) {
          window.handleInput({
            type: 'DIRECTIONAL_VECTOR',
            x: Math.max(-1, Math.min(1, dx / 50)),
            y: 0,
            active: true
          });
        }
      });
      c.addEventListener('pointerup', (e) => {
        if (dragStart && !dragStart.moved) {
          const r = c.getBoundingClientRect();
          window.handleInput({
            type: 'ACTION_PRIMARY',
            x: (e.clientX - r.left) / r.width,
            y: (e.clientY - r.top) / r.height
          });
        }
        dragStart = null;
        window.handleInput({ type: 'DIRECTIONAL_VECTOR', x: 0, y: 0, active: false });
      });

      let last = performance.now();
      function standaloneLoop(now) {
        const dt = (now - last) / 1000;
        last = now;
        window.updateGame(dt);
        window.renderAll(ctx);
        requestAnimationFrame(standaloneLoop);
      }
      requestAnimationFrame(standaloneLoop);
    });
  })();
</script>
