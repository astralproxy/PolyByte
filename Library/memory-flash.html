<!-- microfeed: {"title": "Memory Flash", "icon": "🧠", "description": "Watch the pads light up, then repeat the pattern. Three rounds, each one longer.", "tags": {"Memory": 1, "Puzzle": 0.3, "Minimal": 0.2}} -->
<script>
window.GameMeta={title:'Memory Flash',gameLength:15000};
var W=360,H=640,R=mul(PARAMS.seed),seq=[],pos=0,ph='show',st=0,lit=-1,rounds=0,GOAL=3,score=0,t=0,hint=1,miss=0;
var padState='idle',feedbackTime=0,hintState='idle',hintFeedbackTime=0,focus=0,focusMoved=0;
var COLORS=[145,355,50,215];
function mul(a){return function(){a|=0;a=a+0x6D2B79F5|0;var x=Math.imul(a^a>>>15,1|a);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296}}
function newRound(){seq=[];for(var i=0;i<rounds+2;i++)seq.push((R()*4)|0);pos=0;ph='show';st=0}
newRound();
function pad(x,y){for(var i=0;i<4;i++){var px=20+(i%2)*170,py=170+(i>>1)*170;if(x>=px&&x<=px+150&&y>=py&&y<=py+150)return i}return -1}
function releaseFeedback(){
  if(padState==='pressed'){padState='released';feedbackTime=.16}
  else{padState='idle';lit=-1;feedbackTime=0}
}
function updateFeedback(dt){
  if(feedbackTime<=0)return;
  feedbackTime-=dt;
  if(feedbackTime<=0)releaseFeedback()
}
function updateGame(dt){
  t+=dt;st+=dt;updateFeedback(dt);
  if(hintFeedbackTime>0){
    hintFeedbackTime-=dt;
    if(hintFeedbackTime<=0){
      if(hintState==='pressed'){hintState='released';hintFeedbackTime=.16}
      else{hintFeedbackTime=0;hintState='idle'}
    }
  }
  if(ph==='show'){
    if(feedbackTime<=0){
      var elapsed=st-.42,k=Math.floor(elapsed/.68),within=elapsed% .68;
      if(k>=0&&k<seq.length&&within<.44){lit=seq[k];padState=within<.28?'pressed':'released'}
      else{lit=-1;padState='idle'}
      if(k>=seq.length){ph='play';lit=-1;padState='idle'}
    }
  }
}
function handleInput(e){
  if(e.type==='DIRECTIONAL_VECTOR'){
    if(!e.active){focusMoved=0;return}
    if(focusMoved||ph!=='play')return;
    var dx=Number(e.x)||0,dy=Number(e.y)||0;
    if(Math.max(Math.abs(dx),Math.abs(dy))<.35)return;
    var x=focus%2,y=(focus/2)|0;
    if(Math.abs(dx)>Math.abs(dy))x=Math.max(0,Math.min(1,x+(dx>0?1:-1)));
    else y=Math.max(0,Math.min(1,y+(dy>0?1:-1)));
    focus=y*2+x;focusMoved=1;return
  }
  if(e.type==='ACTION_SECONDARY'){
    if(!hint||ph!=='play')return;
    hint=0;hintState='pressed';hintFeedbackTime=.1;ph='show';st=0;pos=0;return
  }
  if(e.type!=='ACTION_PRIMARY'||ph!=='play')return;
  var p;
  if(Math.abs(e.x-.5)<.002&&Math.abs(e.y-.5)<.002)p=focus;
  else p=pad(e.x*W,e.y*H);
  if(p<0)return;
  focus=p;lit=p;padState='pressed';feedbackTime=.12;
  if(p===seq[pos]){
    pos++;score+=5;
    if(pos>=seq.length){
      rounds++;score+=20;
      if(rounds>=GOAL)Platform.endGame();
      else newRound()
    }
  }else{
    miss++;score=Math.max(0,score-5);ph='show';st=0;pos=0
  }
}
function roundRect(c,x,y,w,h,r){
  c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()
}
function drawPad(c,i){
  var x=22+(i%2)*166,y=157+(i>>1)*168,hue=COLORS[i],selected=i===focus&&ph==='play';
  var pressed=lit===i&&padState==='pressed',released=lit===i&&padState==='released';
  var brightness=pressed?72:released?49:25,saturation=pressed?92:released?78:66;
  var scale=pressed?.94:released?1.015:1;
  c.save();c.translate(x+75,y+75);c.scale(scale,scale);c.translate(-(x+75),-(y+75));
  c.shadowColor='hsla('+hue+',100%,'+(pressed?66:released?55:35)+'%,'+(pressed?.8:released?.48:.12)+')';
  c.shadowBlur=pressed?28:released?17:5;
  roundRect(c,x,y,150,150,28);
  var fill=c.createLinearGradient(x,y,x+115,y+150);
  fill.addColorStop(0,'hsl('+hue+','+saturation+'%,'+(brightness+7)+'%)');
  fill.addColorStop(1,'hsl('+hue+','+saturation+'%,'+brightness+'%)');
  c.fillStyle=fill;c.fill();
  c.shadowBlur=0;
  c.strokeStyle=pressed?'rgba(255,255,255,0.95)':released?'rgba(255,255,255,0.72)':'rgba(255,255,255,0.13)';
  c.lineWidth=pressed?4:released?3:1.5;c.stroke();
  if(pressed||released){
    roundRect(c,x+8,y+8,134,134,22);c.strokeStyle='rgba(255,255,255,'+(pressed?.42:.24)+')';c.lineWidth=2;c.stroke()
  }
  if(selected){roundRect(c,x-4,y-4,158,158,31);c.strokeStyle='rgba(255,255,255,0.9)';c.lineWidth=2;c.stroke()}
  c.restore()
}
function renderAll(c){
  var hue=PARAMS.hue,bg=c.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,'hsl('+hue+',38%,12%)');bg.addColorStop(1,'hsl('+((hue+34)%360)+',44%,7%)');
  c.fillStyle=bg;c.fillRect(0,0,W,H);
  var glow=c.createRadialGradient(180,300,30,180,300,280);
  glow.addColorStop(0,'hsla('+hue+',90%,60%,0.16)');glow.addColorStop(1,'hsla('+hue+',90%,40%,0)');
  c.fillStyle=glow;c.fillRect(0,0,W,H);

  roundRect(c,18,20,324,112,22);c.fillStyle='rgba(255,255,255,0.07)';c.fill();
  c.strokeStyle='rgba(255,255,255,0.12)';c.lineWidth=1;c.stroke();
  c.fillStyle='#fff';c.font='700 23px system-ui';c.fillText('MEMORY FLASH',34,55);
  c.fillStyle='rgba(255,255,255,0.68)';c.font='14px system-ui';
  c.fillText(ph==='show'?'Watch the pattern':'Repeat the pattern',35,81);
  roundRect(c,35,99,290,7,4);c.fillStyle='rgba(255,255,255,0.12)';c.fill();
  roundRect(c,35,99,290*Math.min(1,rounds/GOAL),7,4);c.fillStyle='hsl('+hue+',85%,65%)';c.fill();
  c.fillStyle='rgba(255,255,255,0.75)';c.font='12px system-ui';c.textAlign='right';
  c.fillText('ROUND '+Math.min(GOAL,rounds+1)+' / '+GOAL,325,91);c.textAlign='left';

  c.shadowColor='rgba(0,0,0,0.42)';c.shadowBlur=22;
  roundRect(c,15,151,330,330,34);c.fillStyle='#11131e';c.fill();c.shadowBlur=0;
  roundRect(c,15,151,330,330,34);c.strokeStyle='rgba(255,255,255,0.13)';c.lineWidth=2;c.stroke();
  for(var i=0;i<4;i++)drawPad(c,i);
  roundRect(c,172,307,16,18,5);c.fillStyle='#171a28';c.fill();
  c.strokeStyle='rgba(255,255,255,0.1)';c.lineWidth=1;c.stroke();

  roundRect(c,24,502,312,80,20);
  c.fillStyle=hint?'rgba(255,255,255,0.09)':'rgba(255,255,255,0.045)';c.fill();
  c.strokeStyle=hint?'rgba(255,255,255,0.18)':'rgba(255,255,255,0.08)';c.lineWidth=1;c.stroke();
  if(hintState==='pressed'){
    roundRect(c,25,503,310,78,19);c.strokeStyle='rgba(255,255,255,0.95)';c.lineWidth=3;c.stroke()
  }else if(hintState==='released'){
    roundRect(c,25,503,310,78,19);c.strokeStyle='rgba(255,255,255,0.42)';c.lineWidth=2;c.stroke()
  }
  c.beginPath();c.arc(53,542,17,0,Math.PI*2);
  c.fillStyle=hint?'hsla('+hue+',85%,60%,0.24)':'rgba(255,255,255,0.07)';c.fill();
  c.fillStyle=hint?'hsl('+hue+',95%,78%)':'rgba(255,255,255,0.4)';c.font='700 19px system-ui';c.textAlign='center';c.fillText('↻',53,549);
  c.textAlign='left';c.fillStyle=hint?'#fff':'rgba(255,255,255,0.42)';c.font='600 14px system-ui';
  c.fillText(hint?'Hold or press Shift to replay':'Replay used',80,537);
  c.fillStyle='rgba(255,255,255,0.58)';c.font='12px system-ui';c.fillText('Arrows move · tap or Space to press',80,557)
}
function getResult(){return{score:score,timeElapsed:t,completionPercent:Math.min(100,(rounds+(ph==='play'?pos/seq.length:0))/GOAL*100),customData:{rounds:rounds,miss:miss}}}
</script>
