<!-- microfeed: {"title": "Memory Flash", "icon": "🧠", "description": "Watch the pads light up, then repeat the pattern. Three rounds, each one longer.", "tags": {"Memory": 1, "Puzzle": 0.3, "Minimal": 0.2}} -->
<script>
/* Memory: watch the pad sequence, repeat it. 3 rounds. Hold = replay the sequence once. */
window.GameMeta={title:'Memory Flash',gameLength:15000};
var W=360,H=640,R=mul(PARAMS.seed),seq=[],pos=0,ph='show',st=0,lit=-1,rounds=0,GOAL=3,score=0,t=0,hint=1,miss=0,flash=0;
function mul(a){return function(){a|=0;a=a+0x6D2B79F5|0;var x=Math.imul(a^a>>>15,1|a);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296}}
function newRound(){seq=[];for(var i=0;i<rounds+2;i++)seq.push((R()*4)|0);pos=0;ph='show';st=0}
newRound();
function pad(x,y){for(var i=0;i<4;i++){var px=20+(i%2)*170,py=170+(i>>1)*170;if(x>=px&&x<=px+150&&y>=py&&y<=py+150)return i}return -1}
function updateGame(dt){
  t+=dt;st+=dt;flash-=dt;
  if(ph==='show'){var k=Math.floor((st-.4)/.55);lit=(k>=0&&k<seq.length&&(st-.4)%.55<.4)?seq[k]:-1;if(k>=seq.length){ph='play';lit=-1}}
  else if(flash<=0)lit=-1;
}
function handleInput(e){
  if(e.type==='ACTION_SECONDARY'&&hint&&ph==='play'){hint=0;ph='show';st=0;pos=0;return}
  if(e.type!=='ACTION_PRIMARY'||ph!=='play')return;
  var p=pad(e.x*W,e.y*H);if(p<0)return;lit=p;flash=.18;
  if(p===seq[pos]){pos++;score+=5;if(pos>=seq.length){rounds++;score+=20;if(rounds>=GOAL)Platform.endGame();else newRound()}}
  else{miss++;score=Math.max(0,score-5);ph='show';st=0;pos=0}
}
function renderAll(c){
  var h=PARAMS.hue;c.fillStyle='hsl('+h+',40%,10%)';c.fillRect(0,0,W,H);
  for(var i=0;i<4;i++){c.fillStyle='hsl('+((h+i*80)%360)+',80%,'+(lit===i?68:30)+'%)';c.fillRect(20+(i%2)*170,170+(i>>1)*170,150,150)}
  c.fillStyle='#fff';c.font='bold 24px system-ui';c.fillText(ph==='show'?'Watch…':'Your turn: '+pos+'/'+seq.length,16,60);
  c.font='14px system-ui';c.fillText('Round '+Math.min(GOAL,rounds+1)+'/'+GOAL+(hint&&ph==='play'?'  ·  hold: replay':''),16,86);
}
function getResult(){return{score:score,timeElapsed:t,completionPercent:Math.min(100,(rounds+(ph==='play'?pos/seq.length:0))/GOAL*100),customData:{rounds:rounds,miss:miss}}}
</script>
